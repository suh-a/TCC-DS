<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ordem Crescente - Zupi</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--blue:#7EC8E6;--green:#A8D5BA;--yellow:#FFE66D;--orange:#FFB980;--bg:#F5F7FA;--text:#2D3748;--white:#FFFFFF;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);}
    .bg-s{position:absolute;border-radius:50%;opacity:.11;animation:bgF var(--d,14s) ease-in-out infinite alternate;}
    @keyframes bgF{0%{transform:translateY(0) rotate(0) scale(1)}100%{transform:translateY(-24px) rotate(18deg) scale(1.07);opacity:.18}}
    .zj-nav{position:fixed;top:0;left:0;right:0;height:58px;z-index:300;display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem;background:rgba(245,247,250,.92);backdrop-filter:blur(14px);border-bottom:1.5px solid rgba(126,200,230,.18);box-shadow:0 2px 14px rgba(126,200,230,.10);}
    .zj-logo{font-size:1.25rem;font-weight:900;color:var(--blue);text-decoration:none;}
    .zj-logo b{color:var(--orange);}
    .zj-hud{display:flex;gap:.45rem;flex-wrap:wrap;}
    .zj-pill{padding:.25rem .7rem;border-radius:50px;background:rgba(255,255,255,.85);border:1.5px solid rgba(126,200,230,.25);font-size:.8rem;font-weight:800;}
    .zj-overlay{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;background:rgba(45,55,72,.45);backdrop-filter:blur(12px);padding:1rem;}
    .zj-modal{background:var(--white);border-radius:28px;padding:2.2rem 2rem;max-width:360px;width:100%;text-align:center;border:2px solid rgba(126,200,230,.18);box-shadow:0 20px 60px rgba(45,55,72,.18);animation:mIn .38s cubic-bezier(.34,1.56,.64,1);}
    @keyframes mIn{from{transform:scale(.85) translateY(16px);opacity:0}to{transform:scale(1);opacity:1}}
    .modal-icon{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--green));margin:0 auto 1rem;display:flex;align-items:center;justify-content:center;}
    .modal-icon svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
    .modal-icon.yi{background:linear-gradient(135deg,var(--yellow),var(--orange));}
    .modal-icon.oi{background:linear-gradient(135deg,var(--orange),var(--yellow));}
    .modal-icon.gi{background:linear-gradient(135deg,var(--green),var(--blue));}
    .modal-title{font-size:1.5rem;font-weight:900;margin-bottom:.45rem;}
    .modal-sub{font-size:.88rem;color:#7A90A4;line-height:1.55;margin-bottom:1.3rem;}
    .zj-btn{display:block;width:100%;padding:.75rem;border-radius:50px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;border:none;text-decoration:none;text-align:center;transition:all .22s;margin-top:.5rem;}
    .zj-btn-p{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;box-shadow:0 6px 20px rgba(126,200,230,.35);}
    .zj-btn-p:hover{transform:scale(1.03) translateY(-2px);}
    .zj-btn-y{background:linear-gradient(135deg,var(--yellow),var(--orange));color:var(--text);box-shadow:0 6px 20px rgba(255,230,109,.3);}
    .zj-btn-y:hover{transform:scale(1.03) translateY(-2px);}
    .zj-btn-g{background:transparent;color:#7A90A4;border:2px solid rgba(126,200,230,.28);}
    .zj-btn-g:hover{border-color:var(--blue);color:var(--blue);}
    .zj-main{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:center;padding:74px 1rem 2rem;min-height:100vh;}
    .zj-card{background:var(--white);border-radius:24px;padding:1.5rem 1.4rem;width:100%;max-width:480px;border:2px solid rgba(126,200,230,.14);box-shadow:0 8px 32px rgba(126,200,230,.11);}
    .zj-prog{height:6px;border-radius:6px;background:rgba(126,200,230,.15);overflow:hidden;margin-bottom:1rem;}
    .zj-prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:6px;transition:width .4s ease;}
    .zj-opts{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:.8rem 0;}
    .zj-opt{padding:.9rem .5rem;border:2.5px solid rgba(126,200,230,.22);border-radius:16px;background:rgba(255,255,255,.85);color:var(--text);font-family:'Nunito',sans-serif;font-size:1.35rem;font-weight:800;cursor:pointer;transition:all .22s cubic-bezier(.34,1.56,.64,1);}
    .zj-opt:hover{transform:scale(1.06) translateY(-3px);border-color:var(--blue);box-shadow:0 6px 18px rgba(126,200,230,.25);}
    .zj-opt.ok{background:linear-gradient(135deg,rgba(168,213,186,.25),rgba(126,200,230,.25));border-color:var(--green);animation:optPop .4s;}
    .zj-opt.no{background:rgba(255,185,128,.2);border-color:var(--orange);animation:optShake .38s;}
    @keyframes optPop{0%{transform:scale(1)}50%{transform:scale(1.10)}100%{transform:scale(1)}}
    @keyframes optShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
    .zj-timebar{position:fixed;bottom:0;left:0;right:0;height:5px;z-index:300;background:rgba(126,200,230,.15);}
    .zj-timebar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .9s linear;}
    .zj-streak{font-size:.82rem;font-weight:700;color:var(--orange);min-height:1.3rem;text-align:center;}
    @keyframes floatUp{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-52px);opacity:0}}
    @keyframes confeteQ{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:.1}}
    @keyframes gotaV{0%{transform:translate(0,0);opacity:.9}100%{transform:translate(var(--gx),var(--gy)) scale(0);opacity:0}}
    @keyframes zjPop{0%{transform:scale(1)}50%{transform:scale(1.13)}100%{transform:scale(1)}}
    @keyframes zjShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}

    .ngrid{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem;margin:1rem 0;}
    .nb{width:70px;height:70px;border-radius:16px;border:2.5px solid rgba(126,200,230,.3);background:rgba(255,255,255,.85);font-family:'Nunito',sans-serif;font-size:1.7rem;font-weight:800;color:var(--text);cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);box-shadow:0 3px 10px rgba(126,200,230,.12);}
    .nb:hover:not(:disabled){transform:scale(1.1) translateY(-4px);border-color:var(--blue);box-shadow:0 8px 20px rgba(126,200,230,.28);}
    .nb.ok{background:linear-gradient(135deg,var(--green),var(--blue));color:white;border-color:transparent;pointer-events:none;animation:zjPop .4s;}
    .nb.no{background:rgba(255,185,128,.25);border-color:var(--orange);animation:zjShake .35s;}
    .seq{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;min-height:52px;align-items:center;margin:.5rem 0;}
    .sslot{width:46px;height:46px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--green));color:white;font-weight:900;font-size:1.1rem;display:flex;align-items:center;justify-content:center;animation:zjPop .3s cubic-bezier(.34,1.56,.64,1);font-family:'Nunito',sans-serif;}
    .oinst{font-weight:800;font-size:.95rem;background:linear-gradient(135deg,var(--blue),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.5rem;}
</style>
</head>
<body>
  <div id="zj-bg" style="position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;">
    <div style="position:absolute;inset:0;background-image:radial-gradient(circle,rgba(126,200,230,.15) 1.5px,transparent 1.5px);background-size:34px 34px;"></div>
    <div class="bg-s" style="width:300px;height:300px;background:#7EC8E6;top:-80px;left:-80px;--d:13s;"></div>
    <div class="bg-s" style="width:190px;height:190px;background:#FFE66D;top:10%;right:-55px;--d:17s;border-radius:40% 60%;"></div>
    <div class="bg-s" style="width:240px;height:240px;background:#A8D5BA;bottom:15%;left:-65px;--d:11s;"></div>
    <div class="bg-s" style="width:160px;height:160px;background:#FFB980;bottom:-35px;right:8%;--d:15s;border-radius:60% 40%;"></div>
  </div>
  <nav class="zj-nav">
    <a href="/menuJogos" class="zj-logo">Zupi<b>.</b></a>
    <div class="zj-hud"><div class="zj-pill" id="p">0 pts</div><div class="zj-pill">Nivel <span id="nv">1</span></div></div>
  </nav>
  <div class="zj-main">
    <div class="zj-card" id="jcard" style="display:none">
      <div class="zj-prog"><div class="zj-prog-fill" id="pf" style="width:0%"></div></div>
      <div class="oinst">Toque nos numeros do menor ao maior!</div>
      <div class="seq" id="seq"></div>
      <div class="ngrid" id="ngrid"></div>
      <div class="zj-streak" id="omsg"></div>
    </div>
  </div>
  <div class="zj-overlay" id="oi">
    <div class="zj-modal">
      <div class="modal-icon yi"><svg viewBox="0 0 24 24"><path d="M8 6l4-4 4 4M12 2v13M4 18h16"/></svg></div>
      <div class="modal-title">Ordem Crescente!</div>
      <div class="modal-sub">Toque nos numeros do menor para o maior! Cada fase fica mais dificil!</div>
      <button class="zj-btn zj-btn-y" onclick="iniciar()">Jogar!</button>
      <a href="/menuJogos" class="zj-btn zj-btn-g">Menu</a>
    </div>
  </div>  <div class="zj-overlay" id="of" style="display:none">
    <div class="zj-modal">
      <div class="modal-icon yi"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></div>
      <div class="modal-title" id="ft">Fim!</div>
      <div class="modal-sub" id="fs"></div>
      <button class="zj-btn zj-btn-p" onclick="reiniciar()">Jogar novamente</button>
      
      <a href="/menuJogos" class="zj-btn zj-btn-g">Menu</a>
    </div>
  </div>
  <script>
    var _ac;function _gac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();return _ac;}
    function zupiTone(f,tp,v,dur){try{var c=_gac(),tm=c.currentTime;var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f||440;o.type=tp||'sine';g.gain.setValueAtTime(v||.15,tm);g.gain.exponentialRampToValueAtTime(.001,tm+(dur||.18));o.start(tm);o.stop(tm+(dur||.18));}catch(e){}}
    function zupiRight(){try{var c=_gac(),t=c.currentTime;[523,659,784].forEach(function(f,i){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.14,t+i*.1);g.gain.exponentialRampToValueAtTime(.001,t+i*.1+.15);o.start(t+i*.1);o.stop(t+i*.1+.15);});}catch(e){}}
    function zupiWrong(){try{var c=_gac(),t=c.currentTime;var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=200;o.type='sawtooth';g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.start(t);o.stop(t+.32);}catch(e){}}
    function zupiLevelUp(){try{var c=_gac(),t=c.currentTime;[523,659,784,1046].forEach(function(f,i){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.16,t+i*.12);g.gain.exponentialRampToValueAtTime(.001,t+i*.12+.18);o.start(t+i*.12);o.stop(t+i*.12+.18);});}catch(e){}}
    function zupiFloat(x,y,txt,cor){var el=document.createElement('div');el.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;color:'+(cor||'#7EC8E6')+';font-family:Nunito,sans-serif;font-weight:900;font-size:1.1rem;pointer-events:none;z-index:900;animation:floatUp .9s ease-out forwards;transform:translateX(-50%);white-space:nowrap;';el.textContent=txt;document.body.appendChild(el);setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},950);}
    function zupiConfete(q){var c=['#7EC8E6','#A8D5BA','#FFE66D','#FFB980'];for(var i=0;i<(q||30);i++){(function(){var el=document.createElement('div');var dur=(1.4+Math.random()*1.8).toFixed(2);var del=(Math.random()*.8).toFixed(2);el.style.cssText='position:fixed;left:'+Math.random()*100+'vw;top:-20px;width:'+(7+Math.random()*10)+'px;height:'+(7+Math.random()*10)+'px;background:'+c[Math.floor(Math.random()*c.length)]+';border-radius:'+(Math.random()>.5?'50%':'3px')+';pointer-events:none;z-index:800;animation:confeteQ '+dur+'s ease-in '+del+'s forwards;';document.body.appendChild(el);setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},(parseFloat(dur)+parseFloat(del))*1000+200);})();}}
    function zupiGota(cx,cy,cor,qtd){for(var i=0;i<(qtd||8);i++){(function(idx){var g=document.createElement('div');var ang=(idx/(qtd||8))*Math.PI*2,d=28+Math.random()*40;g.style.cssText='position:fixed;left:'+cx+'px;top:'+cy+'px;width:'+(5+Math.random()*6)+'px;height:'+(5+Math.random()*6)+'px;background:'+(cor||'#7EC8E6')+';border-radius:50%;pointer-events:none;z-index:700;margin:-3px 0 0 -3px;animation:gotaV .65s ease-out forwards;--gx:'+Math.cos(ang)*d+'px;--gy:'+Math.sin(ang)*d+'px;';document.body.appendChild(g);setTimeout(function(){if(g.parentNode)g.parentNode.removeChild(g);},700);})(i);}}

    var pts=0,nivel=1,rodada=0,total=12,seq=[],prox=0,resp=false;
    function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
    function shuffle(a){return a.sort(function(){return Math.random()-.5;});}
    function iniciar(){document.getElementById('oi').style.display='none';document.getElementById('jcard').style.display='';pts=0;nivel=1;rodada=0;gerarRodada();}
    function gerarRodada(){resp=false;prox=0;var qtd=nivel<=2?4:nivel<=4?5:6;var maxN=nivel<=2?10:nivel<=4?20:30;var nums=[];while(nums.length<qtd){var n=rnd(1,maxN);if(nums.indexOf(n)<0)nums.push(n);}seq=nums.slice().sort(function(a,b){return a-b;});var emb=shuffle(nums.slice());document.getElementById('seq').innerHTML='';document.getElementById('omsg').textContent='';var grid=document.getElementById('ngrid');grid.innerHTML='';emb.forEach(function(n){var b=document.createElement('button');b.className='nb';b.textContent=n;b.onclick=function(){clicar(b,n);};grid.appendChild(b);});rodada++;document.getElementById('pf').style.width=(rodada/total*100)+'%';document.getElementById('nv').textContent=nivel;}
    function clicar(btn,n){if(resp||btn.classList.contains('ok')) return;if(n===seq[prox]){btn.classList.add('ok');zupiTone(400+prox*60,'sine',.18);var s=document.createElement('div');s.className='sslot';s.textContent=n;document.getElementById('seq').appendChild(s);var r=btn.getBoundingClientRect();zupiFloat(r.left+35,r.top,'+5','#A8D5BA');pts+=5;document.getElementById('p').textContent=pts+' pts';prox++;if(prox===seq.length){resp=true;zupiLevelUp();zupiConfete(18);document.getElementById('omsg').textContent='Perfeito!';if(rodada%3===0)nivel=Math.min(nivel+1,6);if(rodada>=total)setTimeout(fimDeJogo,800);else setTimeout(gerarRodada,1200);}}else{btn.classList.add('no');zupiWrong();document.getElementById('omsg').textContent='Ops! Tente a ordem certa!';setTimeout(function(){btn.classList.remove('no');document.getElementById('omsg').textContent='';},650);}}
    function fimDeJogo(){document.getElementById('ft').textContent=pts>80?'Genio!':pts>40?'Muito bom!':'Bom jogo!';document.getElementById('fs').textContent='Pontuacao: '+pts+' pontos! Nivel '+nivel+'!';document.getElementById('of').style.display='flex';zupiConfete(30);}
    function reiniciar(){document.getElementById('of').style.display='none';pts=0;nivel=1;rodada=0;gerarRodada();}
</script>
  <script src="/js/routes.js"></script><script src="/js/api.js"></script><script src="/js/auth-guard.js"></script><script src="/js/game-guard.js"></script><script src="/js/game-score.js"></script>
</body>
</html>
