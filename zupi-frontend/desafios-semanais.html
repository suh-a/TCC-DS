<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Desafios — Zupi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/dark-mode.css" />
</head>
<body data-child-nav="desafios">
  <button class="menu-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#dashboardOffcanvas" aria-label="Abrir menu">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>
  <section class="container-fluid">
    <section class="row">
      <nav class="col-lg-2 dashboard-sidebar p-0 position-fixed vh-100 d-none d-lg-block" aria-label="Navegação">
        <section class="d-flex flex-column p-4 h-100">
          <p class="navbar-brand text-white mb-4 fs-3 fw-bold">Zupi</p>
          <ul class="nav nav-pills flex-column">
            <li class="nav-item mb-2"><a class="nav-link text-white" href="/dashboard-crianca" data-child-nav-link="dashboard">Dashboard</a></li>
            <li class="nav-item mb-2"><a class="nav-link text-white" href="/menuJogos" data-child-nav-link="jogos">Jogos</a></li>
            <li class="nav-item mb-2"><a class="nav-link text-white" href="/atividades-interativas" data-child-nav-link="atividades">Atividades</a></li>
            <li class="nav-item mb-2"><a class="nav-link text-white active" href="/desafios-semanais" data-child-nav-link="desafios">Desafios semanais</a></li>
            <li class="nav-item mb-2"><a class="nav-link text-white" href="/biblioteca" data-child-nav-link="biblioteca">Biblioteca</a></li>
            <li class="nav-item mb-2"><a class="nav-link text-white" href="/perfil-crianca" data-child-nav-link="perfil">Perfil</a></li>
            <li class="nav-item mt-auto"><a class="nav-link text-white" href="/selecao-perfil">Voltar ao menu</a></li>
          </ul>
        </section>
      </nav>
      <main class="col-12 col-lg-10 ms-lg-auto dashboard-main-content px-3 px-lg-4 py-4">
        <h1 class="text-zupi-primary mb-2">Desafios</h1>
        <h2 class="h5 mb-4">Desafio semanal</h2>
        <section id="desafiosList">
          <article class="desafio-quiz-card mb-3" role="button" tabindex="0">Quiz</article>
        </section>
      </main>
    </section>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/routes.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/responsavel-sidebar.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/child-nav.js"></script>
  <script src="/js/content-pages.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      ChildNav.init({ active: 'desafios' });
      if (typeof ContentPages !== 'undefined') await ContentPages.loadDesafios();
    });
  </script>
</body>
</html>
