<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Cadastrar - Zupi</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        crossorigin="anonymous">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@400;500&display=swap"
        rel="stylesheet">

  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/auth.css" />

  <link rel="icon"
        href="../assets/img/favicon.png"
        type="image/png">
</head>

<body class="auth-page cadastro-page">

<div class="background-decor" aria-hidden="true"></div>

<nav class="navbar navbar-expand-lg navbar-light bg-white">
  <div class="container">
    <a class="navbar-brand"
       id="brand-color-2"
       href="/">
      Zupi
    </a>

    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="/login">
            Entrar
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-9 col-xl-8">
        <div class="auth-card cadastro-card">
          <div class="cadastro-header">
            <p class="cadastro-kicker" id="cadastroTipoLabel">Cadastro</p>
            <h1 id="cadastroTitulo">Cadastro Zupi</h1>
          </div>

          <div class="step-indicator" id="stepIndicator" aria-label="Etapas do cadastro"></div>

          <form id="cadastroForm" novalidate>
            <div id="cadastroSteps"></div>
          </form>
        </div>

        <p class="text-center mt-4 mb-0">
          Ja tem conta?
          <a href="/login">Entre aqui</a>
        </p>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="/js/routes.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth-guard.js"></script>
<script src="/js/cadastroScript.js"></script>

</body>
</html>
