<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Conta os Objetos - Zupi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/zupi-jogos.css">
  <style>
    .cobj{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;padding:.75rem;background:rgba(126,200,230,.06);border-radius:16px;min-height:90px;font-size:2.3rem;margin:.7rem 0;}
    .co{display:inline-block;animation:coIn .35s cubic-bezier(.34,1.56,.64,1) both;}
    @keyframes coIn{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:scale(1);opacity:1}}
    .cops{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem;margin:.5rem 0;}
    .cb{padding:.85rem .4rem;border:2.5px solid rgba(126,200,230,.25);border-radius:14px;background:rgba(255,255,255,.85);color:#2D3748;font-family:'Poppins',sans-serif;font-size:1.5rem;font-weight:800;cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);}
    .cb:hover{transform:scale(1.08) translateY(-3px);border-color:#7EC8E6;box-shadow:0 6px 16px rgba(126,200,230,.28);}
    .cb.ok{background:linear-gradient(135deg,#A8D5BA,#7EC8E6);border-color:transparent;color:white;animation:zjPop .4s;}
    .cb.no{background:rgba(249,198,208,.25);border-color:#F9C6D0;animation:zjShake .35s;}
    .cperg{font-family:'Poppins',sans-serif;font-weight:700;font-size:1.05rem;color:#2D3748;margin:.4rem 0;}
    .cst{font-size:.85rem;color:#FFB980;font-family:'Poppins',sans-serif;font-weight:700;min-height:1.3rem;}
  </style>
</head>
<body class="zj-body">
<div id="zj-sky" class="zj-sky"></div>
<nav class="zj-nav">
  <a href="/menuJogos" class="zj-brand">&#x1F43E; Zupi</a>
  <div class="zj-stats">
    <div class="zj-pill">&#x2B50; <span id="p">0</span></div>
    <div class="zj-pill">&#x1F522; <span id="q">1/15</span></div>
    <div class="zj-pill">&#x1F525; <span id="st">0</span></div>
  </div>
</nav>
<div class="zj-main">
  <div class="zj-card" id="jcard" style="display:none">
    <div class="zj-prog"><div class="zj-prog-fill" id="pf" style="width:0%"></div></div>
    <div class="cperg" id="perg">Quantos objetos tem?</div>
    <div class="cobj" id="objs"></div>
    <div class="cops" id="opts"></div>
    <div class="cst" id="stm"></div>
  </div>
</div>
<div class="zj-overlay" id="oi">
  <div class="zj-modal">
    <span class="zj-modal-emoji">&#x1F34E;</span>
    <div class="zj-modal-title">Conta os Objetos!</div>
    <div class="zj-modal-sub">Conte os emojis na tela e escolha o numero certo! Quanto mais acerta, mais dificil fica!</div>
    <button class="zj-btn zj-btn-main" onclick="iniciar()">&#x1F680; Jogar!</button><br>
    <a href="/menuJogos" class="zj-btn zj-btn-ghost" style="margin-top:.5rem">&#x2B05; Menu</a>
  </div>
</div>
<div class="zj-overlay" id="of" style="display:none">
  <div class="zj-modal">
    <span class="zj-modal-emoji" id="fe">&#x1F3C6;</span>
    <div class="zj-modal-title" id="ft">Fim!</div>
    <div class="zj-modal-sub" id="fs"></div>
    <button class="zj-btn zj-btn-main" onclick="reiniciar()">&#x1F504; Jogar novamente</button><br>
    <a href="/menuJogos" class="zj-btn zj-btn-ghost" style="margin-top:.5rem">&#x2B05; Menu</a>
  </div>
</div>
<script src="/js/zupi-sky.js"></script>
<script th:inline="none">
zupiSky();
var EMOJIS=[['&#x1F34E;','&#x1F34A;','&#x1F34B;','&#x1F347;'],['&#x2B50;','&#x1F31F;','&#x1F4AB;','&#x2728;'],['&#x1F436;','&#x1F431;','&#x1F430;','&#x1F439;'],['&#x1F338;','&#x1F33A;','&#x1F33B;','&#x1F339;']];
var pts=0,streak=0,q=0,total=15,resp=false;
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function iniciar(){document.getElementById('oi').style.display='none';document.getElementById('jcard').style.display='';pts=0;streak=0;q=0;gerarQ();}
function gerarQ(){
  resp=false;
  var nv=Math.floor(q/5);
  var maxO=nv===0?5:nv===1?10:15;
  var minO=nv===0?1:nv===1?4:8;
  var qtd=rnd(minO,maxO);
  var set=EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
  var emo=set[Math.floor(Math.random()*set.length)];
  document.getElementById('perg').innerHTML='Quantos '+emo+' voce ve?';
  var objs='';
  for(var i=0;i<qtd;i++) objs+='<span class="co" style="animation-delay:'+(i*.04)+'s">'+emo+'</span>';
  document.getElementById('objs').innerHTML=objs;
  var opts=gerarOpts(qtd,maxO);
  var el=document.getElementById('opts');el.innerHTML='';
  opts.forEach(function(v){
    var b=document.createElement('button');b.className='cb';b.textContent=v;
    b.onclick=function(){responder(b,v,qtd);};
    el.appendChild(b);
  });
  q++;
  document.getElementById('q').textContent=q+'/'+total;
  document.getElementById('pf').style.width=((q-1)/total*100)+'%';
}
function gerarOpts(c,max){
  var s=new Set([c]);
  while(s.size<4){var d=rnd(1,4)*(Math.random()>.5?1:-1);var v=Math.max(1,c+d);if(v!==c)s.add(v);}
  return Array.from(s).sort(function(a,b){return a-b;});
}
function responder(btn,val,certa){
  if(resp) return; resp=true;
  if(val===certa){
    btn.classList.add('ok'); zupiRight(); streak++;
    var bonus=Math.floor(streak/3)*5; pts+=10+bonus;
    document.getElementById('p').textContent=pts;
    document.getElementById('st').textContent=streak;
    document.getElementById('stm').textContent=streak>=3?'Sequencia de '+streak+'! +'+bonus+' bonus!':'';
    zupiConfete(15);
    if(q>=total) setTimeout(fimDeJogo,800);
    else setTimeout(gerarQ,950);
  } else {
    btn.classList.add('no'); zupiWrong(); streak=0;
    document.getElementById('st').textContent=0;
    document.getElementById('stm').textContent='';
    document.querySelectorAll('.cb').forEach(function(b){if(parseInt(b.textContent)===certa) b.classList.add('ok');});
    setTimeout(gerarQ,1100);
  }
}
function fimDeJogo(){
  document.getElementById('fe').innerHTML=pts>=120?'&#x1F3C6;':pts>=70?'&#x2B50;':'&#x1F3AF;';
  document.getElementById('ft').textContent=pts>=120?'Genio dos numeros!!':pts>=70?'Muito bom!':'Continue praticando!';
  document.getElementById('fs').textContent='Pontuacao: '+pts+' pontos!';
  document.getElementById('of').style.display='flex';
  zupiConfete(30);
}
function reiniciar(){document.getElementById('of').style.display='none';pts=0;streak=0;q=0;gerarQ();}
</script>
  <script src="/js/routes.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth-guard.js"></script>

  <script src="/js/game-guard.js"></script>

  <script src="/js/game-score.js"></script>
</body>
</html>
