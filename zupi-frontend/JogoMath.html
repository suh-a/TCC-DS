<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Matematica Magica - Zupi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/zupi-jogos.css">
  
  <link rel="stylesheet" href="/css/jogos/jogomath-page.css" />
</head>
<body class="zj-body">
<div id="zj-sky" class="zj-sky"></div>
<nav class="zj-nav">
  <a href="/menuJogos" class="zj-brand">&#x1F43E; Zupi</a>
  <div class="zj-stats">
    <div class="zj-pill">&#x2B50; <span id="p">0</span></div>
    <div class="zj-pill">&#x2764;&#xFE0F; <span id="v">3</span></div>
    <div class="zj-pill">&#x1F525; <span id="st">0</span></div>
    <div class="zj-pill">Nv <span id="nv">1</span></div>
  </div>
</nav>
<div class="zj-main">
  <div class="zj-card" id="jcard" style="display:none">
    <div class="zj-prog"><div class="zj-prog-fill" id="pf" style="width:0%"></div></div>
    <div class="nvbadge" id="nvbadge" style="background:rgba(126,200,230,.15);color:#7EC8E6;border:1px solid rgba(126,200,230,.35)">Nivel 1 - Iniciante</div>
    <div class="prob"><span class="n1" id="n1">?</span><span class="op" id="op">+</span><span class="n2" id="n2">?</span><span class="eq">=</span><span class="qm">?</span></div>
    <div class="objs" id="objs"></div>
    <div class="streakm" id="stm"></div>
    <div class="opts" id="opts"></div>
  </div>
</div>

<div class="zj-overlay" id="oi">
  <div class="zj-modal">
    <span class="zj-modal-emoji">&#x1F522;</span>
    <div class="zj-modal-title">Matematica Magica!</div>
    <div class="zj-modal-sub">Escolha a resposta certa! 5 niveis: do facil ao mestre! Cada acerto vale pontos!</div>
    <button class="zj-btn zj-btn-main" onclick="iniciar()">&#x1F680; Comecar!</button><br>
    <a href="/menuJogos" class="zj-btn zj-btn-ghost" style="margin-top:.5rem">&#x2B05; Menu</a>
  </div>
</div>
<div class="zj-overlay" id="of" style="display:none">
  <div class="zj-modal">
    <span class="zj-modal-emoji" id="fe">&#x1F3C6;</span>
    <div class="zj-modal-title" id="ft">Fim!</div>
    <div class="zj-modal-sub" id="fs"></div>
    <button class="zj-btn zj-btn-main" onclick="reiniciar()">&#x1F504; Jogar novamente</button><br>
    <a href="/menuJogos" class="zj-btn zj-btn-ghost" style="margin-top:.5rem">&#x2B05; Menu</a>
  </div>
</div>

<script src="/js/zupi-sky.js"></script>
<script>
zupiSky();
var NIVEIS=[
  {nome:'Iniciante',cor:'#A8D5BA',max:5,ops:['+'],q:5},
  {nome:'Basico',   cor:'#FFE66D',max:10,ops:['+','-'],q:8},
  {nome:'Medio',    cor:'#FFB980',max:15,ops:['+','-','x'],q:10},
  {nome:'Avancado', cor:'#7EC8E6',max:20,ops:['+','-','x'],q:12},
  {nome:'Mestre',   cor:'#C8B8F0',max:30,ops:['+','-','x','/'],q:15}
];
var EMOJIS=['&#x1F34E;','&#x2B50;','&#x1F382;','&#x1F36D;','&#x1F436;','&#x1F98B;','&#x1F338;','&#x1F366;'];
var pts=0,vidas=3,streak=0,nv=0,qNv=0,resp=false;
var corResp;

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function iniciar(){
  document.getElementById('oi').style.display='none';
  document.getElementById('jcard').style.display='';
  pts=0;vidas=3;streak=0;nv=0;qNv=0;resp=false;
  atuHud(); gerarQ();
}
function gerarQ(){
  resp=false;
  var n=NIVEIS[nv];
  var op=n.ops[Math.floor(Math.random()*n.ops.length)];
  var a,b,res;
  if(op==='+'){a=rnd(1,n.max);b=rnd(1,n.max);res=a+b;}
  else if(op==='-'){a=rnd(2,n.max);b=rnd(1,a);res=a-b;}
  else if(op==='x'){a=rnd(1,Math.min(n.max,10));b=rnd(1,Math.min(n.max,10));res=a*b;}
  else{b=rnd(1,8);res=rnd(1,8);a=b*res;}
  corResp=res;
  document.getElementById('n1').textContent=a;
  document.getElementById('op').textContent=op;
  document.getElementById('n2').textContent=b;
  var emo=EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
  var objs='';
  if(op==='+'){for(var i=0;i<a;i++) objs+='<span class="obj" style="animation-delay:'+(i*.04)+'s">'+emo+'</span>';objs+='<span style="font-size:1.4rem;margin:0 .5rem;opacity:.7">'+op+'</span>';for(var i=0;i<b;i++) objs+='<span class="obj" style="animation-delay:'+((a+i)*.04)+'s">'+emo+'</span>';}
  else if(op==='-'||op==='x'){for(var i=0;i<Math.min(a,15);i++) objs+='<span class="obj" style="animation-delay:'+(i*.04)+'s">'+emo+'</span>';}
  document.getElementById('objs').innerHTML=objs;
  var opcoes=gerarOpts(res,n.max);
  var opts=document.getElementById('opts');opts.innerHTML='';
  var cores=['rgba(126,200,230,.12)','rgba(168,213,186,.12)','rgba(255,230,109,.12)','rgba(200,184,240,.12)'];
  opcoes.forEach(function(v,i){
    var b=document.createElement('button');b.className='obt';b.textContent=v;
    b.style.background=cores[i];
    b.onclick=function(){responder(b,v);};
    opts.appendChild(b);
  });
  qNv++; document.getElementById('pf').style.width=(qNv/NIVEIS[nv].q*100)+'%';
  atuHud();
}
function gerarOpts(c,max){
  var s=new Set([c]);
  while(s.size<4){var d=Math.floor(Math.random()*6)-3;if(d===0) d=rnd(1,4)*(Math.random()>.5?1:-1);var v=Math.max(0,c+d);s.add(v);}
  return Array.from(s).sort(function(){return Math.random()-.5;});
}
function responder(btn,val){
  if(resp) return; resp=true;
  if(val===corResp){
    btn.classList.add('ok'); zupiRight(); streak++;
    var bonus=Math.floor(streak/3)*10;
    pts+=10+bonus+nv*5;
    document.getElementById('stm').textContent=streak>=3?'Sequencia de '+streak+'! +'+bonus+' bonus!':'';
    if(qNv>=NIVEIS[nv].q&&nv<4){
      setTimeout(function(){zupiLevelUp();nv++;qNv=0;mostrarNvUp();},700);
    } else {setTimeout(function(){resp=false;atuHud();gerarQ();},900);}
  } else {
    btn.classList.add('no'); zupiWrong(); streak=0;
    document.getElementById('stm').textContent='';
    document.querySelectorAll('.obt').forEach(function(b){if(parseInt(b.textContent)===corResp) b.classList.add('ok');});
    vidas--; atuHud();
    if(vidas<=0){setTimeout(gameOver,1100);return;}
    setTimeout(function(){resp=false;atuHud();gerarQ();},1200);
  }
  atuHud();
}
function mostrarNvUp(){
  var n=NIVEIS[nv];
  var d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;background:rgba(45,55,72,.5);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:700';
  d.innerHTML='<div style="background:white;border-radius:28px;padding:2.5rem 2rem;text-align:center;max-width:380px;width:90%;border:2.5px solid rgba(126,200,230,.25);animation:modalPop .5s cubic-bezier(.34,1.56,.64,1)"><div style="font-size:4.5rem">&#x2B06;&#xFE0F;</div><div style="font-family:Poppins,sans-serif;font-size:1.8rem;font-weight:900;color:'+n.cor+';margin:.4rem 0">NIVEL UP!</div><div style="font-family:Poppins,sans-serif;font-size:1.1rem;margin-bottom:1rem;color:#6B7280">'+n.nome+'</div><button onclick="this.closest(\'div[style]\').remove();resp=false;atuHud();gerarQ();" style="padding:.7rem 2rem;background:linear-gradient(135deg,#7EC8E6,#A8D5BA);color:white;font-family:Poppins,sans-serif;font-weight:700;border:none;border-radius:50px;cursor:pointer;font-size:1rem;">Continuar!</button></div>';
  document.body.appendChild(d);
}
function gameOver(){
  document.getElementById('of').style.display='flex';
  document.getElementById('fe').innerHTML=pts>300?'&#x1F3C6;':pts>150?'&#x2B50;':'&#x1F4AA;';
  document.getElementById('ft').textContent=pts>300?'Incrivel!!':pts>150?'Muito bom!':'Continue praticando!';
  document.getElementById('fs').textContent=pts+' pontos! Nivel '+(nv+1)+' alcancado!';
}
function reiniciar(){document.getElementById('of').style.display='none';iniciar();}
function atuHud(){
  document.getElementById('p').textContent=pts;
  document.getElementById('v').textContent='❤️'.repeat(Math.max(0,vidas));
  document.getElementById('st').textContent=streak;
  document.getElementById('nv').textContent=nv+1;
  var n=NIVEIS[nv];
  var badge=document.getElementById('nvbadge');
  badge.textContent='Nivel '+(nv+1)+' - '+n.nome;
  badge.style.color=n.cor; badge.style.borderColor=n.cor;
}
</script>
</body>
</html>
