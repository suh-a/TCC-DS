<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complete o Padrao - Zupi</title>
  <link rel="stylesheet" href="/css/zupi-cognitive-games.css">
</head>
<body data-game="patterns">
  <div class="cg-bg" aria-hidden="true"><span class="cg-shape"></span><span class="cg-shape"></span><span class="cg-shape"></span><span class="cg-shape"></span></div>
  <nav class="cg-nav">
    <a class="cg-brand" href="/menuJogos">Zupi</a>
    <div class="cg-stats">
      <span class="cg-pill">Fase <b id="cgRound">1</b></span>
      <span class="cg-pill">Pontos <b id="cgScore">0/8</b></span>
    </div>
  </nav>
  <main class="cg-main">
    <section class="cg-card">
      <div class="cg-progress"><span id="cgProgress"></span></div>
      <div class="cg-stage" id="cgStage"></div>
    </section>
  </main>
  <div class="cg-overlay" id="cgOverlay">
    <div class="cg-modal">
      <div class="cg-modal-mark"></div>
      <span class="cg-kicker">Memoria visual</span>
      <h1 class="cg-title">Complete o padrão</h1>
      <p class="cg-sub">Observe formas e cores para descobrir qual peça vem depois.</p>
      <button class="cg-btn primary" id="cgStart">Começar</button>
      <a class="cg-btn" href="/menuJogos">Voltar ao menu</a>
    </div>
  </div>
  <div class="cg-overlay cg-hidden" id="cgEnd">
    <div class="cg-modal">
      <div class="cg-modal-mark"></div>
      <h2 class="cg-title" id="cgEndTitle">Fim</h2>
      <p class="cg-sub" id="cgEndText"></p>
      <button class="cg-btn primary" id="cgRestart">Jogar novamente</button>
      <a class="cg-btn" href="/menuJogos">Menu</a>
    </div>
  </div>
  <script src="/js/routes.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/game-guard.js"></script>
  <script src="/js/game-score.js"></script>
  <script src="/js/zupi-cognitive-games.js"></script>
</body>
</html>
