<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atividades — Zupi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/dark-mode.css" />
</head>
<body data-child-nav="atividades">
  <button class="menu-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#dashboardOffcanvas" aria-label="Abrir menu">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>
  <section class="container-fluid">
    <section class="row">
      <nav class="col-lg-2 dashboard-sidebar p-0 position-fixed vh-100 d-none d-lg-block" aria-label="Navegação">
        <section class="d-flex flex-column p-4 h-100">
          <p class="navbar-brand text-white mb-4 fs-3 fw-bold">Zupi</p>
          <ul class="nav nav-pills flex-column pf-sidebar-nav" data-pf-sidebar aria-busy="true"></ul>
        </section>
      </nav>
      <main class="col-12 col-lg-10 ms-lg-auto dashboard-main-content px-3 px-lg-4 py-4">
        <h1 class="text-zupi-primary mb-2">Atividades</h1>
        <p class="text-muted mb-4">Atividades educativas personalizadas com base no seu perfil.</p>
        <section id="atividadesList" class="row g-4 child-books-grid"></section>
        <button id="btnPdf" class="btn btn-outline-primary mt-4" type="button">Baixar atividades em PDF</button>
      </main>
    </section>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/routes.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/responsavel-sidebar.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/child-nav.js"></script>
  <script src="/js/school-parent-content.js"></script>
  <script src="/js/content-pages.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      ChildNav.init({ active: 'atividades' });
      if (typeof ContentPages !== 'undefined') {
        await ContentPages.loadAtividades();
        document.getElementById('btnPdf')?.addEventListener('click', () => ContentPages.downloadPdf('atividades'));
      }
    });
  </script>
</body>
</html>
