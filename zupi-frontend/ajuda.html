<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ajuda — Zupi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/dark-mode.css" />
</head>
<body>
  <div class="background-decor" aria-hidden="true">
    <span class="decor-shape decor-circle" style="width:180px;height:180px;top:10%;left:5%;background:var(--zupi-accent);"></span>
  </div>

  <button class="menu-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#dashboardOffcanvas" aria-label="Abrir menu">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <div class="container-fluid">
    <div class="row">
      <nav class="col-lg-2 dashboard-sidebar p-0 position-fixed vh-100 d-none d-lg-block" aria-label="Navegação">
        <div class="d-flex flex-column p-4 h-100">
          <div class="navbar-brand text-white mb-4 fs-3 fw-bold">Zupi</div>
          <ul class="nav nav-pills flex-column pf-sidebar-nav" data-pf-sidebar>
              <li class="nav-item mb-2">
                <a class="nav-link text-white" href="/dashboard">Dashboard</a>
              </li>
              <li class="nav-item mb-2">
                <a class="nav-link text-white" href="/selecao-perfil">Perfis das crianças</a>
              </li>
              <li class="nav-item mb-2">
                <a class="nav-link text-white" href="/selecao-relatorios">Relatórios</a>
              </li>
              <li class="nav-item mb-2">
                <a class="nav-link text-white" href="/cadastro-dependentes">Cadastro de dependentes</a>
              </li>
              <li class="nav-item mb-2">
                <a class="nav-link text-white" href="/agenda">Agenda</a>
              </li>
              <li class="nav-item mb-2">
                <a class="nav-link text-white active" href="/ajuda" aria-current="page">Ajuda?</a>
              </li>
              <li class="nav-item mb-2">
                <a class="nav-link text-white" href="/perfil-responsavel">Perfil</a>
              </li>
              <li class="nav-item mt-auto">
                <a class="nav-link text-white" href="#" data-action="logout">Sair</a>
              </li>
            </ul>
        </div>
      </nav>

      <main class="col-12 col-lg-10 ms-lg-auto dashboard-main-content px-3 px-lg-4 py-4">
        <h1 class="text-zupi-primary mb-4">Ajuda</h1>

        <section class="ajuda-chat-panel mx-auto">
          <h2 class="h5 text-white mb-4">Chat</h2>
          <div id="chatMessages" class="ajuda-chat-messages mb-3">
            <article class="ajuda-msg ajuda-msg--in">
              <div class="ajuda-msg-avatar" aria-hidden="true">Z</div>
              <div>
                <strong class="ajuda-msg-name">Equipe Zupi</strong>
                <p class="ajuda-msg-bubble">Olá! Como podemos ajudar você hoje?</p>
              </div>
            </article>
          </div>

          <form id="chatForm" class="ajuda-chat-input" autocomplete="off">
            <button type="button" class="btn btn-link text-dark p-0" title="Anexo" disabled>📎</button>
            <input type="text" id="chatInput" class="form-control border-0" placeholder="Digite sua mensagem..." required>
            <button type="submit" class="btn btn-link text-dark p-0" title="Enviar">➤</button>
          </form>
        </section>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="/js/routes.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/responsavel-sidebar.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/ajudaScript.js"></script>
</body>
</html>
