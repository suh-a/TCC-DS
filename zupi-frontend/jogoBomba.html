<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💣 Foge da Bomba — Zupi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/zupi-sky-theme.css">
  
  <link rel="stylesheet" href="/css/jogos/jogobomba-page.css" />
</head>
<body class="g-body">
<div id="sky-canvas" class="sky-canvas"></div>
<div id="exp-overlay"></div>

<nav class="sky-nav">
  <a href="/menuJogos" class="sky-nav-brand">🐾 Zupi</a>
  <div class="sky-nav-stats">
    <div class="sky-pill">⭐ <span id="s-pts">0</span></div>
    <div class="sky-pill">❤️ <span id="s-hp">3</span></div>
    <div class="sky-pill">⏱ <span id="s-t">30</span>s</div>
    <div class="sky-pill">🌊 Nível <span id="s-nv">1</span></div>
  </div>
</nav>

<div id="game-area" class="game-area"></div>

<!-- OVERLAY INÍCIO -->
<div class="sky-overlay" id="ov-i">
  <div class="sky-modal">
    <span class="modal-emoji">💣</span>
    <div class="modal-title">Foge da Bomba!</div>
    <div class="modal-sub">Clique nos itens bons 🌟🍭⭐ e EVITE as bombas 💣 e caveiras ☠️! Não erre mais de 3 vezes!</div>
    <button class="sky-btn sky-btn-main" onclick="iniciar()">🚀 Jogar!</button><br>
    <a href="/menuJogos" class="sky-btn sky-btn-ghost" style="margin-top:.5rem">⬅ Menu</a>
  </div>
</div>

<!-- OVERLAY FIM -->
<div class="sky-overlay" id="ov-f" style="display:none">
  <div class="sky-modal">
    <span class="modal-emoji" id="f-e">🏆</span>
    <div class="modal-title" id="f-t">Fim!</div>
    <div class="modal-sub" id="f-s"></div>
    <button class="sky-btn sky-btn-main" onclick="reiniciar()">🔄 Jogar novamente</button><br>
    <a href="/menuJogos" class="sky-btn sky-btn-ghost" style="margin-top:.5rem">⬅ Menu</a>
  </div>
</div>

<script>
/*<![CDATA[*/

/* ── SKY ENGINE — cole no <script> de cada jogo ── */
/* sky-engine loaded externally */
  const s=c.createBufferSource();s.buffer=buf;const g=c.createGain();g.gain.setValueAtTime(.45,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);
  s.connect(g);g.connect(c.destination);s.start();}catch(e){}
}
buildSky();

const BONS=[
  {e:'⭐',c:'#FFE66D',s:'rgba(255,230,109,.5)',pts:10},
  {e:'🍭',c:'#F9C6D0',s:'rgba(249,198,208,.5)',pts:15},
  {e:'🌟',c:'#FFE66D',s:'rgba(255,230,109,.5)',pts:10},
  {e:'💎',c:'#7EC8E6',s:'rgba(126,200,230,.5)',pts:20},
  {e:'🍀',c:'#A8D5BA',s:'rgba(168,213,186,.5)',pts:18},
  {e:'🎈',c:'#F9C6D0',s:'rgba(249,198,208,.5)',pts:12},
  {e:'🌈',c:'#C8B8F0',s:'rgba(200,184,240,.5)',pts:25},
];
const MAUS=[{e:'💣'},{e:'☠️'},{e:'💀'},{e:'🧨'}];

let pts=0,hp=3,nivel=1,rodando=false,tempo=30;
let spawnInt,tempoInt,itensCont=0;
const area=document.getElementById('game-area');

function iniciar(){
  document.getElementById('ov-i').style.display='none';
  pts=0;hp=3;nivel=1;tempo=30;rodando=true;itensCont=0;
  atuHud();area.innerHTML='';
  clearInterval(spawnInt);clearInterval(tempoInt);
  spawnInt=setInterval(spawnItem,Math.max(500,1300-nivel*70));
  tempoInt=setInterval(()=>{
    tempo--;document.getElementById('s-t').textContent=tempo;
    if(tempo<=0){nivel++;tempo=30+nivel*5;document.getElementById('s-nv').textContent=nivel;clearInterval(spawnInt);spawnInt=setInterval(spawnItem,Math.max(500,1300-nivel*70));}
  },1000);
  for(let i=0;i<3;i++)setTimeout(spawnItem,i*300);
}

function spawnItem(){
  if(!rodando||itensCont>12+nivel)return;
  const mau=Math.random()<Math.min(.32+nivel*.04,.55);
  const tam=55+Math.random()*35;
  const vida=Math.max(1500,3800-nivel*200);
  const el=document.createElement('div');el.className='item '+(mau?'mau':'bom');
  const cfg=mau?MAUS[Math.floor(Math.random()*MAUS.length)]:BONS[Math.floor(Math.random()*BONS.length)];
  if(!mau){el.style.setProperty('--ic',cfg.c);el.style.setProperty('--is',cfg.s);}
  el.style.cssText+=`width:${tam}px;height:${tam}px;font-size:${tam*.5}px;left:${4+Math.random()*88}%;animation-duration:${vida}ms;`;
  el.textContent=cfg.e;
  itensCont++;
  el.addEventListener('click',e=>{e.stopPropagation();clicar(el,cfg,mau);});
  el.addEventListener('animationend',()=>{if(el.parentNode){el.remove();itensCont=Math.max(0,itensCont-1);if(!mau&&rodando){hp--;atuHud();if(hp<=0)fimDeJogo();}}});
  area.appendChild(el);
}

function clicar(el,cfg,mau){
  if(!el.parentNode||!rodando)return;
  const r=el.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;
  el.remove();itensCont=Math.max(0,itensCont-1);
  if(mau){
    // BOMBA — punição
    hp--;atuHud();
    const ov=document.getElementById('exp-overlay');ov.style.display='block';
    setTimeout(()=>{ov.style.display='none';},380);
    skyWrong();
    // Onda de explosão
    const burst=document.createElement('div');burst.className='burst';
    burst.style.cssText=`left:${cx}px;top:${cy}px;width:60px;height:60px;margin:-30px 0 0 -30px;background:rgba(255,100,100,.4);border:3px solid #FF6B6B;`;
    document.body.appendChild(burst);setTimeout(()=>burst.remove(),500);
    skyFloat(cx,cy,'💥 -1❤️','#FF6B6B');
    if(hp<=0)fimDeJogo();
  }else{
    // BOM
    skyRight();pts+=cfg.pts+Math.floor(nivel*1.5);atuHud();
    // Gotas coloridas
    for(let i=0;i<8;i++){const g=document.createElement('div');g.className='drop-gota';const a=(i/8)*Math.PI*2,d=30+Math.random()*40;
    g.style.cssText=`left:${cx}px;top:${cy}px;width:${5+Math.random()*7}px;height:${5+Math.random()*7}px;background:${cfg.c};position:fixed;margin:-3px 0 0 -3px;--gx:${Math.cos(a)*d}px;--gy:${Math.sin(a)*d}px;`;
    document.body.appendChild(g);setTimeout(()=>g.remove(),700);}
    skyFloat(cx,cy,'+'+pts,'#A8D5BA');
  }
}

function atuHud(){
  document.getElementById('s-pts').textContent=pts;
  document.getElementById('s-hp').textContent='❤️'.repeat(Math.max(0,hp));
  document.getElementById('s-nv').textContent=nivel;
}

function fimDeJogo(){
  rodando=false;clearInterval(spawnInt);clearInterval(tempoInt);area.innerHTML='';
  document.getElementById('f-e').textContent=pts>300?'🏆':pts>150?'⭐':'💣';
  document.getElementById('f-t').textContent=pts>300?'Herói Anti-Bomba!!':pts>150?'Muito esperto!':'Quase!';
  document.getElementById('f-s').textContent=`${pts} pontos conquistados! Nível ${nivel}!`;
  document.getElementById('ov-f').style.display='flex';
  if(pts>150)skyConfete();
}
function reiniciar(){document.getElementById('ov-f').style.display='none';area.innerHTML='';iniciar();}

/*]]>*/
</script>
<script src="/js/sky-engine.js"></script>
</body>
</html>
