<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Esqueci minha senha - Zupi</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/main.css" /><link rel="stylesheet" href="/css/auth.css" /></head>
<body class="auth-page auth-page--reset"><div class="auth-orbit" aria-hidden="true"><span></span><span></span><span></span><span></span></div><main class="auth-main"><section class="auth-shell" aria-labelledby="forgotTitle"><section class="auth-card auth-card--interactive auth-reset-card"><a class="auth-back-link" href="/login">Voltar ao login</a><div class="auth-card-header"><span class="auth-kicker">Recupera&ccedil;&atilde;o de acesso</span><h1 id="forgotTitle">Esqueceu sua senha?</h1><p>Informe o e-mail cadastrado. Se ele existir na plataforma, enviaremos as instru&ccedil;&otilde;es para redefinir sua senha.</p></div><form id="formEsqueci" novalidate><div class="auth-field mb-3"><label for="email" class="form-label">E-mail cadastrado</label><input type="email" class="form-control" id="email" placeholder="voce@email.com" required autocomplete="email"></div><button type="submit" class="btn btn-primary w-100 auth-submit" id="forgotSubmit">Enviar link</button><p id="msg" class="auth-feedback" role="status"></p></form><div class="auth-help-steps" aria-label="Como funciona"><article><strong>1</strong><span>Voc&ecirc; informa o e-mail</span></article><article><strong>2</strong><span>N&oacute;s enviamos o link</span></article><article><strong>3</strong><span>Voc&ecirc; cria uma nova senha</span></article></div></section></section></main><script src="/js/routes.js"></script><script src="/js/api.js"></script><script src="/js/auth-guard.js"></script><script src="/js/password-reset.js"></script></body></html>
