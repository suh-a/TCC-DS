<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Esqueci minha senha — Zupi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="auth-page">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="auth-card p-4">
          <h1 class="h4 mb-3">Recuperar senha</h1>
          <p class="text-muted small">Enviaremos um link para redefinir sua senha.</p>
          <form id="formEsqueci">
            <div class="mb-3">
              <label for="email" class="form-label">E-mail cadastrado</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Enviar link</button>
            <p id="msg" class="mt-3 small"></p>
          </form>
          <p class="mt-3 mb-0 text-center"><a href="/login">Voltar ao login</a></p>
        </div>
      </div>
    </div>
  </main>
  <script src="/js/routes.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/password-reset.js"></script>
</body>
</html>
