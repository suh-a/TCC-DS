<!DOCTYPE html>

<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Redefinir senha - Zupi</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/main.css" /><link rel="stylesheet" href="/css/auth.css" /></head>
<body class="auth-page auth-page--reset"><div class="auth-orbit" aria-hidden="true"><span></span><span></span><span></span><span></span></div><main class="auth-main"><section class="auth-shell" aria-labelledby="resetTitle"><section class="auth-card auth-card--interactive auth-reset-card"><div class="auth-card-header"><span class="auth-kicker">Nova senha</span><h1 id="resetTitle">Crie uma senha segura</h1><p>Use pelo menos 6 caracteres. Uma combina&ccedil;&atilde;o de letras, n&uacute;meros e s&iacute;mbolos deixa sua conta mais protegida.</p></div><form id="formReset" novalidate><div class="auth-field mb-3"><label for="senha" class="form-label">Nova senha</label><div class="auth-password-wrap"><input type="password" class="form-control" id="senha" required minlength="6" autocomplete="new-password"><button type="button" class="auth-eye-btn" data-toggle-password="senha" aria-label="Mostrar senha">Mostrar</button></div><div class="auth-strength" aria-hidden="true"><span id="passwordStrengthBar"></span></div><small id="passwordStrengthText" class="auth-hint">For&ccedil;a da senha: aguardando digita&ccedil;&atilde;o.</small></div><div class="auth-field mb-3"><label for="senha2" class="form-label">Confirmar senha</label><div class="auth-password-wrap"><input type="password" class="form-control" id="senha2" required autocomplete="new-password"><button type="button" class="auth-eye-btn" data-toggle-password="senha2" aria-label="Mostrar senha">Mostrar</button></div></div><button type="submit" class="btn btn-primary w-100 auth-submit" id="resetSubmit">Salvar nova senha</button><p id="msg" class="auth-feedback" role="status"></p></form></section></section></main><script src="/js/routes.js"></script><script src="/js/api.js"></script><script src="/js/auth-guard.js"></script><script src="/js/password-reset.js"></script></body></html>
