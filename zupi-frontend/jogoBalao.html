<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Baloes - Zupi</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--blue:#7EC8E6;--green:#A8D5BA;--yellow:#FFE66D;--orange:#FFB980;--bg:#F5F7FA;--text:#2D3748;--white:#FFFFFF;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}

    /* FUNDO */
    #zj-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
    .bg-dot{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(126,200,230,.15) 1.5px,transparent 1.5px);background-size:34px 34px;}
    .bg-s{position:absolute;border-radius:50%;opacity:.11;animation:bgF var(--d,14s) ease-in-out infinite alternate;}
    @keyframes bgF{0%{transform:translateY(0) rotate(0) scale(1);opacity:.11}100%{transform:translateY(-24px) rotate(18deg) scale(1.07);opacity:.18}}

    /* NAV */
    .zj-nav{position:fixed;top:0;left:0;right:0;height:58px;z-index:300;display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem;background:rgba(245,247,250,.92);backdrop-filter:blur(14px);border-bottom:1.5px solid rgba(126,200,230,.18);box-shadow:0 2px 14px rgba(126,200,230,.10);}
    .zj-logo{font-size:1.25rem;font-weight:900;color:var(--blue);text-decoration:none;letter-spacing:-.4px;}
    .zj-logo b{color:var(--orange);}
    .zj-hud{display:flex;gap:.45rem;align-items:center;}
    .zj-pill{padding:.25rem .7rem;border-radius:50px;background:rgba(255,255,255,.85);border:1.5px solid rgba(126,200,230,.25);font-size:.8rem;font-weight:800;color:var(--text);}

    /* AREA DE JOGO */
    .ga{position:fixed;inset:0;top:58px;bottom:72px;overflow:hidden;z-index:1;}

    /* BALAO */
    .bol{position:absolute;border-radius:50%;cursor:pointer;animation:bolSobe linear forwards;transform-origin:center bottom;}
    .bol-inner{width:100%;height:100%;border-radius:50%;position:relative;overflow:hidden;}
    .bol-brilho{position:absolute;top:14%;left:18%;width:30%;height:18%;background:rgba(255,255,255,.62);border-radius:50%;transform:rotate(-25deg);}
    .bol-brilho2{position:absolute;bottom:12%;right:14%;width:16%;height:9%;background:rgba(255,255,255,.38);border-radius:50%;}
    .bol-corda{position:absolute;bottom:-18px;left:50%;width:1.5px;height:18px;background:rgba(0,0,0,.18);transform:translateX(-50%);}
    @keyframes bolSobe{0%{bottom:-120px;opacity:0}5%{opacity:1}30%{transform:translateX(12px)}60%{transform:translateX(-10px)}85%{transform:translateX(8px)}95%{opacity:1}100%{bottom:108%;opacity:0}}

    /* BARRA ALVO */
    .alvo-bar{position:fixed;bottom:0;left:0;right:0;height:70px;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:2px solid rgba(126,200,230,.18);display:flex;align-items:center;justify-content:center;gap:1rem;z-index:300;box-shadow:0 -4px 20px rgba(126,200,230,.10);}
    .al-label{font-weight:700;font-size:.85rem;color:#7A90A4;}
    .al-circ{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.5);box-shadow:0 0 0 0 var(--gc,#7EC8E6);animation:alPulse 1s ease-in-out infinite alternate;}
    @keyframes alPulse{from{box-shadow:0 0 8px var(--gc,#7EC8E6)}to{box-shadow:0 0 22px var(--gc,#7EC8E6),0 0 40px var(--gc,#7EC8E6)}}
    .al-nome{font-weight:900;font-size:1.05rem;}

    /* PARTICULAS */
    .anel{position:fixed;pointer-events:none;border-radius:50%;border:3px solid var(--c,#7EC8E6);animation:anelE .48s ease-out forwards;z-index:400;}
    @keyframes anelE{0%{transform:scale(.2);opacity:.9}100%{transform:scale(3.5);opacity:0}}
    .gota{position:fixed;pointer-events:none;border-radius:50%;animation:gotaV .65s ease-out forwards;z-index:400;}
    @keyframes gotaV{0%{transform:translate(0,0);opacity:.9}100%{transform:translate(var(--gx),var(--gy)) scale(0);opacity:0}}

    /* OVERLAY */
    .zj-overlay{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;background:rgba(45,55,72,.45);backdrop-filter:blur(12px);padding:1rem;}
    .zj-modal{background:var(--white);border-radius:28px;padding:2.2rem 2rem;max-width:360px;width:100%;text-align:center;border:2px solid rgba(126,200,230,.18);box-shadow:0 20px 60px rgba(45,55,72,.18);animation:mIn .38s cubic-bezier(.34,1.56,.64,1);}
    @keyframes mIn{from{transform:scale(.85) translateY(16px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
    .modal-icon{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--green));margin:0 auto 1rem;display:flex;align-items:center;justify-content:center;}
    .modal-icon svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;}
    .modal-title{font-size:1.5rem;font-weight:900;margin-bottom:.45rem;}
    .modal-sub{font-size:.88rem;color:#7A90A4;line-height:1.55;margin-bottom:1.3rem;}
    .zj-btn{display:block;width:100%;padding:.75rem;border-radius:50px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;border:none;text-decoration:none;text-align:center;transition:all .22s;margin-top:.5rem;}
    .zj-btn-p{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;box-shadow:0 6px 20px rgba(126,200,230,.35);}
    .zj-btn-p:hover{transform:scale(1.03) translateY(-2px);}
    .zj-btn-g{background:transparent;color:#7A90A4;border:2px solid rgba(126,200,230,.28);}
    .zj-btn-g:hover{border-color:var(--blue);color:var(--blue);}
  </style>
</head>
<body>
  <!-- FUNDO -->
  <div id="zj-bg">
    <div class="bg-dot"></div>
    <div class="bg-s" style="width:300px;height:300px;background:var(--blue);top:-80px;left:-80px;--d:13s;"></div>
    <div class="bg-s" style="width:190px;height:190px;background:var(--yellow);top:10%;right:-55px;--d:17s;border-radius:40% 60%;"></div>
    <div class="bg-s" style="width:240px;height:240px;background:var(--green);bottom:15%;left:-65px;--d:11s;"></div>
    <div class="bg-s" style="width:160px;height:160px;background:var(--orange);bottom:-35px;right:8%;--d:15s;border-radius:60% 40%;"></div>
  </div>

  <!-- NAV -->
  <nav class="zj-nav">
    <a href="/menuJogos" class="zj-logo">Zupi<b>.</b></a>
    <div class="zj-hud">
      <div class="zj-pill" id="p">0 pts</div>
      <div class="zj-pill">Vidas <span id="v">3</span></div>
      <div class="zj-pill">Serie <span id="st">0</span></div>
    </div>
  </nav>

  <div id="ga" class="ga"></div>

  <!-- BARRA ALVO -->
  <div class="alvo-bar" id="abar" style="display:none">
    <div class="al-label">Estoure apenas:</div>
    <div class="al-circ" id="acirc" style="--gc:var(--blue);background:var(--blue)"></div>
    <div class="al-nome" id="anome" style="color:var(--blue)">Azul</div>
  </div>

  <!-- OVERLAY INICIO -->
  <div class="zj-overlay" id="oi">
    <div class="zj-modal">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="7"/><path d="M12 17v4"/></svg>
      </div>
      <div class="modal-title">Salva os Baloes!</div>
      <div class="modal-sub">Estoure apenas os baloes da cor indicada em baixo. Acertar errado tira vida!</div>
      <button class="zj-btn zj-btn-p" onclick="iniciar()">Comecar!</button>
      <a href="/menuJogos" class="zj-btn zj-btn-g">Menu</a>
    </div>
  </div>

  <!-- OVERLAY FIM -->
  <div class="zj-overlay" id="of" style="display:none">
    <div class="zj-modal">
      <div class="modal-icon" id="fim-icon" style="background:linear-gradient(135deg,var(--yellow),var(--orange))">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke="#fff" fill="none" stroke-width="2" stroke-linejoin="round"/></svg>
      </div>
      <div class="modal-title" id="ft">Fim!</div>
      <div class="modal-sub" id="fs"></div>
      <button class="zj-btn zj-btn-p" onclick="reiniciar()">Jogar novamente</button>
      <a href="/menuJogos" class="zj-btn zj-btn-g">Menu</a>
    </div>
  </div>

  <script>
    var CORES = [
      {n:'Azul',   h:'#7EC8E6'},{n:'Verde',  h:'#A8D5BA'},
      {n:'Amarelo',h:'#FFE66D'},{n:'Laranja',h:'#FFB980'},
    ];
    var pts=0, vidas=3, streak=0, rodando=false, nivel=1, corAlvo;
    var spInt, mudaInt;
    var ga = document.getElementById('ga');

    function sortear(){ return CORES[Math.floor(Math.random()*CORES.length)]; }

    function iniciar(){
      document.getElementById('oi').style.display='none';
      document.getElementById('abar').style.display='flex';
      pts=0; vidas=3; streak=0; nivel=1; rodando=true;
      atuHud(); ga.innerHTML=''; trocarAlvo();
      spInt = setInterval(spawnBol, Math.max(500,1200-nivel*60));
      mudaInt = setInterval(function(){
        nivel++; trocarAlvo();
        clearInterval(spInt);
        spInt = setInterval(spawnBol, Math.max(500,1200-nivel*60));
      }, 12000);
      for(var i=0;i<3;i++) setTimeout(spawnBol, i*280);
    }

    function trocarAlvo(){
      corAlvo = sortear();
      var circ = document.getElementById('acirc');
      circ.style.background = corAlvo.h;
      circ.style.setProperty('--gc', corAlvo.h);
      document.getElementById('anome').textContent = corAlvo.n;
      document.getElementById('anome').style.color = corAlvo.h;
    }

    function spawnBol(){
      if(!rodando) return;
      var c = CORES[Math.floor(Math.random()*CORES.length)];
      var tam = 52 + Math.random()*52;
      var vida = Math.max(2200, 5000-nivel*250);
      var b = document.createElement('div'); b.className='bol';
      b.style.cssText = 'width:'+tam+'px;height:'+tam+'px;left:'+(4+Math.random()*88)+'%;animation-duration:'+vida+'ms;';
      b.innerHTML = '<div class="bol-inner" style="background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.55),'+c.h+' 55%);"><div class="bol-brilho"></div><div class="bol-brilho2"></div></div><div class="bol-corda"></div>';
      b._c = c;
      b.addEventListener('click', function(e){ e.stopPropagation(); estouro(b,c); });
      b.addEventListener('touchstart', function(e){ e.preventDefault(); estouro(b,c); }, {passive:false});
      b.addEventListener('animationend', function(){
        if(b.parentNode){ b.parentNode.removeChild(b);
          if(rodando && c.n===corAlvo.n){ vidas--; atuHud(); if(vidas<=0) fimDeJogo(); }
        }
      });
      ga.appendChild(b);
    }

    function estouro(b,c){
      if(!b.parentNode||!rodando) return;
      var r=b.getBoundingClientRect(); var cx=r.left+r.width/2, cy=r.top+r.height/2, tam=r.width;
      if(b.parentNode) b.parentNode.removeChild(b);
      // anel
      var ag=document.createElement('div'); ag.className='anel';
      ag.style.cssText='left:'+cx+'px;top:'+cy+'px;width:'+tam+'px;height:'+tam+'px;margin:'+(-tam/2)+'px 0 0 '+(-tam/2)+'px;--c:'+c.h;
      document.body.appendChild(ag); setTimeout(function(){if(ag.parentNode)ag.parentNode.removeChild(ag);},500);
      // gotas
      for(var i=0;i<9;i++){(function(idx){
        var g=document.createElement('div'); g.className='gota';
        var ang=(idx/9)*Math.PI*2, d=28+Math.random()*45;
        g.style.cssText='left:'+cx+'px;top:'+cy+'px;width:'+(5+Math.random()*7)+'px;height:'+(5+Math.random()*7)+'px;background:'+c.h+';margin:-3px 0 0 -3px;--gx:'+Math.cos(ang)*d+'px;--gy:'+Math.sin(ang)*d+'px;';
        document.body.appendChild(g); setTimeout(function(){if(g.parentNode)g.parentNode.removeChild(g);},700);
      })(i);}

      if(c.n===corAlvo.n){
        streak++; var bonus=streak>=3?Math.floor(streak/3)*5:0;
        pts+=10+bonus+Math.floor(nivel*1.5); atuHud();
        zupiFloat(cx,cy,'+'+pts,c.h);
        if(streak>=3) zupiFloat(cx,cy-40,'x'+streak+'!','#FFB980');
        zupiTone(440+streak*30,'sine',.15);
      } else {
        streak=0; vidas--; atuHud();
        zupiFloat(cx,cy,'X','#FFB980');
        zupiWrong();
        if(vidas<=0) fimDeJogo();
      }
    }

    function atuHud(){
      document.getElementById('p').textContent = pts+' pts';
      document.getElementById('v').textContent = Math.max(0,vidas);
      document.getElementById('st').textContent = streak;
    }

    function fimDeJogo(){
      rodando=false; clearInterval(spInt); clearInterval(mudaInt); ga.innerHTML='';
      document.getElementById('abar').style.display='none';
      document.getElementById('ft').textContent = pts>250?'Mestre das Cores!':pts>120?'Muito bom!':'Continue tentando!';
      document.getElementById('fs').textContent = pts+' pontos! Nivel '+nivel+'!';
      document.getElementById('of').style.display='flex';
      if(pts>100) zupiConfete(30);
    }

    function reiniciar(){ document.getElementById('of').style.display='none'; ga.innerHTML=''; iniciar(); }

    // Utils inline
    function zupiFloat(x,y,txt,cor){
      var el=document.createElement('div');
      el.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;color:'+(cor||'#7EC8E6')+';font-family:Nunito,sans-serif;font-weight:900;font-size:1.1rem;pointer-events:none;z-index:900;animation:floatUp .9s ease-out forwards;transform:translateX(-50%);white-space:nowrap;';
      el.textContent=txt; document.body.appendChild(el);
      setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},950);
    }
    function zupiConfete(q){
      var c=['#7EC8E6','#A8D5BA','#FFE66D','#FFB980'];
      for(var i=0;i<q;i++){var el=document.createElement('div');var dur=(1.4+Math.random()*1.8).toFixed(2);var del=(Math.random()*.8).toFixed(2);el.style.cssText='position:fixed;left:'+Math.random()*100+'vw;top:-20px;width:'+(7+Math.random()*10)+'px;height:'+(7+Math.random()*10)+'px;background:'+c[Math.floor(Math.random()*c.length)]+';border-radius:'+(Math.random()>.5?'50%':'3px')+';pointer-events:none;z-index:800;animation:confeteQ '+dur+'s ease-in '+del+'s forwards;';document.body.appendChild(el);setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},(parseFloat(dur)+parseFloat(del))*1000+200);}
    }
    var _ac; function _gac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();return _ac;}
    function zupiTone(f,t,v){try{var c=_gac(),tm=c.currentTime;var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;o.type=t||'sine';g.gain.setValueAtTime(v||.15,tm);g.gain.exponentialRampToValueAtTime(.001,tm+.18);o.start(tm);o.stop(tm+.18);}catch(e){}}
    function zupiWrong(){try{var c=_gac(),t=c.currentTime;var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=200;o.type='sawtooth';g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.start(t);o.stop(t+.32);}catch(e){}}

    var st = document.createElement('style');
    st.textContent='@keyframes floatUp{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-52px);opacity:0}}@keyframes confeteQ{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:.1}}';
    document.head.appendChild(st);
  </script>
  <script src="/js/routes.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/game-guard.js"></script>
  <script src="/js/game-score.js"></script>
</body>
</html>
