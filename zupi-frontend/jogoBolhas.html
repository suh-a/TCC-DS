<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Estoura Bolhas - Zupi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/zupi-jogos.css">
  
  <link rel="stylesheet" href="/css/jogos/jogobolhas-page.css" />
</head>
<body class="zj-body">
<div id="zj-sky" class="zj-sky"></div>
<nav class="zj-nav">
  <a href="/menuJogos" class="zj-brand">&#x1F43E; Zupi</a>
  <div class="zj-stats">
    <div class="zj-pill">&#x2B50; <span id="p">0</span></div>
    <div class="zj-pill">&#x2764;&#xFE0F; <span id="v">3</span></div>
    <div class="zj-pill">Nivel <span id="n">1</span></div>
  </div>
</nav>
<div id="ga" class="ga"></div>
<div id="combo"></div>
<div class="zj-timebar"><div class="zj-timebar-fill" id="tb" style="width:100%"></div></div>

<div class="zj-overlay" id="oi">
  <div class="zj-modal">
    <span class="zj-modal-emoji">&#x1FAE7;</span>
    <div class="zj-modal-title">Estoura Bolhas!</div>
    <div class="zj-modal-sub">Toque nas bolhas de sabao antes que voem! Combos valem mais pontos!</div>
    <button class="zj-btn zj-btn-main" onclick="iniciar()">&#x1F680; Comecar!</button><br>
    <a href="/menuJogos" class="zj-btn zj-btn-ghost" style="margin-top:.5rem">&#x2B05; Menu</a>
  </div>
</div>
<div class="zj-overlay" id="of" style="display:none">
  <div class="zj-modal">
    <span class="zj-modal-emoji" id="fe">&#x1F3C6;</span>
    <div class="zj-modal-title" id="ft">Fim!</div>
    <div class="zj-modal-sub" id="fs"></div>
    <button class="zj-btn zj-btn-main" onclick="reiniciar()">&#x1F504; Jogar novamente</button><br>
    <a href="/menuJogos" class="zj-btn zj-btn-ghost" style="margin-top:.5rem">&#x2B05; Menu</a>
  </div>
</div>

<script src="/js/zupi-sky.js"></script>
<script>
zupiSky();
var CORES = [
  {bg:'rgba(126,200,230,VAR)', bd:'#7EC8E6', gota:'#b3dff2', pts:10},
  {bg:'rgba(168,213,186,VAR)', bd:'#A8D5BA', gota:'#c8e8d4', pts:12},
  {bg:'rgba(255,230,109,VAR)', bd:'#FFE66D', gota:'#fff0a0', pts:15},
  {bg:'rgba(255,185,128,VAR)', bd:'#FFB980', gota:'#ffd5a8', pts:18},
  {bg:'rgba(249,198,208,VAR)', bd:'#F9C6D0', gota:'#fcc8e6', pts:20},
  {bg:'rgba(200,184,240,VAR)', bd:'#C8B8F0', gota:'#dbd0fe', pts:22}
];
var pts=0, vidas=3, nivel=1, combo=0, ultCombo=0, rodando=false, ba=0;
var spInt, tmInt, tmTotal, tmRest;
var ga = document.getElementById('ga');
var comboEl = document.getElementById('combo');

function iniciar() {
  document.getElementById('oi').style.display='none';
  pts=0; vidas=3; nivel=1; combo=0; rodando=true; ba=0;
  atualizar(); iniciarNivel();
}
function iniciarNivel() {
  document.getElementById('n').textContent=nivel;
  tmTotal=30+nivel*6; tmRest=tmTotal;
  clearInterval(spInt); clearInterval(tmInt);
  spInt=setInterval(spawnBol, Math.max(450,1300-nivel*85));
  tmInt=setInterval(function(){
    tmRest--;
    document.getElementById('tb').style.width=(tmRest/tmTotal*100)+'%';
    if(tmRest<=0){nivel++;iniciarNivel();}
  },1000);
  for(var i=0;i<Math.min(nivel+1,4);i++) setTimeout(spawnBol,i*200);
}
function spawnBol() {
  if(!rodando||ba>13+nivel) return;
  var c=CORES[Math.floor(Math.random()*CORES.length)];
  var tam=55+Math.random()*55, vida=Math.max(2200,5500-nivel*270);
  var left=4+Math.random()*88, op=.5+Math.random()*.28;
  var b=document.createElement('div'); b.className='bol';
  var bg=c.bg.replace('VAR',op);
  b.style.cssText='width:'+tam+'px;height:'+tam+'px;left:'+left+'%;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.65) 0%,'+bg+' 40%,rgba(255,255,255,.06) 100%);border:1.5px solid '+c.bd+'55;box-shadow:0 0 '+(tam*.28)+'px '+c.bd+'44,inset 0 0 '+(tam*.18)+'px rgba(255,255,255,.35);animation-duration:'+vida+'ms';
  b._c=c; b._t=tam; ba++;
  b.addEventListener('click',function(e){e.stopPropagation();estouro(b,c,e.clientX,e.clientY);});
  b.addEventListener('touchstart',function(e){e.preventDefault();estouro(b,c,e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
  b.addEventListener('animationend',function(){if(b.parentNode){b.parentNode.removeChild(b);ba=Math.max(0,ba-1);if(rodando){vidas--;atualizar();if(vidas<=0)fim();}}});
  ga.appendChild(b);
}
function estouro(b,c,cx,cy) {
  if(!b.parentNode||!rodando) return;
  var r=b.getBoundingClientRect(); var bx=r.left+r.width/2; var by=r.top+r.height/2; var tam=r.width;
  if(b.parentNode) b.parentNode.removeChild(b); ba=Math.max(0,ba-1);
  zupiPop(tam);
  var ag=document.createElement('div'); ag.className='anel';
  ag.style.cssText='position:fixed;left:'+bx+'px;top:'+by+'px;width:'+tam+'px;height:'+tam+'px;margin:'+(-tam/2)+'px 0 0 '+(-tam/2)+'px;--c:'+c.bd;
  document.body.appendChild(ag); setTimeout(function(){if(ag.parentNode)ag.parentNode.removeChild(ag);},500);
  for(var i=0;i<10;i++){(function(idx){
    var g=document.createElement('div'); g.className='gota';
    var ang=(idx/10)*Math.PI*2, d=28+Math.random()*48;
    g.style.cssText='position:fixed;left:'+bx+'px;top:'+by+'px;width:'+(5+Math.random()*7)+'px;height:'+(5+Math.random()*7)+'px;background:'+c.gota+';margin:-3px 0 0 -3px';
    g.style.setProperty('--gx',Math.cos(ang)*d+'px');
    g.style.setProperty('--gy',Math.sin(ang)*d+'px');
    document.body.appendChild(g); setTimeout(function(){if(g.parentNode)g.parentNode.removeChild(g);},700);
  })(i);}
  var agora=Date.now();
  if(agora-ultCombo<1600) combo++; else combo=1;
  ultCombo=agora;
  var bonus=combo>1?combo:1;
  var p=(c.pts+Math.floor(nivel*1.5))*bonus;
  pts+=p; atualizar();
  zupiFloat(bx,by,'+'+p,c.bd);
  if(combo>=3){
    var msgs={3:'COMBO x3!',4:'COMBO x4!',5:'SUPER COMBO!',6:'INCRIVEL!'};
    comboEl.textContent=msgs[Math.min(combo,6)]||'COMBO x'+combo+'!';
    comboEl.style.color=['#FFE66D','#7EC8E6','#A8D5BA','#FFB980'][Math.floor(Math.random()*4)];
    comboEl.classList.remove('combo-show'); void comboEl.offsetWidth; comboEl.classList.add('combo-show');
  }
}
function atualizar(){
  document.getElementById('p').textContent=pts;
  document.getElementById('v').textContent='❤️'.repeat(Math.max(0,vidas));
}
function fim(){
  rodando=false; clearInterval(spInt); clearInterval(tmInt);
  ga.innerHTML=''; ba=0;
  document.getElementById('fe').textContent=pts>300?'🏆':pts>150?'⭐':'🫧';
  document.getElementById('ft').textContent=pts>300?'Incrivel!!':pts>150?'Muito bom!':'Continue tentando!';
  document.getElementById('fs').textContent=pts+' pontos! Nivel '+nivel+' alcancado!';
  document.getElementById('of').style.display='flex';
  if(pts>100) zupiConfete();
}
function reiniciar(){document.getElementById('of').style.display='none';ga.innerHTML='';ba=0;iniciar();}
</script>
</body>
</html>
