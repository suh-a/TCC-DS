<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Estoura Bolhas - Zupi</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--blue:#7EC8E6;--green:#A8D5BA;--yellow:#FFE66D;--orange:#FFB980;--bg:#F5F7FA;--text:#2D3748;--white:#FFFFFF;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);}
    .bg-s{position:absolute;border-radius:50%;opacity:.11;animation:bgF var(--d,14s) ease-in-out infinite alternate;}
    @keyframes bgF{0%{transform:translateY(0) rotate(0) scale(1)}100%{transform:translateY(-24px) rotate(18deg) scale(1.07);opacity:.18}}
    .zj-nav{position:fixed;top:0;left:0;right:0;height:58px;z-index:300;display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem;background:rgba(245,247,250,.92);backdrop-filter:blur(14px);border-bottom:1.5px solid rgba(126,200,230,.18);box-shadow:0 2px 14px rgba(126,200,230,.10);}
    .zj-logo{font-size:1.25rem;font-weight:900;color:var(--blue);text-decoration:none;}
    .zj-logo b{color:var(--orange);}
    .zj-hud{display:flex;gap:.45rem;}
    .zj-pill{padding:.25rem .7rem;border-radius:50px;background:rgba(255,255,255,.85);border:1.5px solid rgba(126,200,230,.25);font-size:.8rem;font-weight:800;}
    .ga{position:fixed;inset:0;top:58px;overflow:hidden;z-index:1;}
    .bol{position:absolute;border-radius:50%;cursor:pointer;animation:bolSubir linear forwards;}
    .bol-gl{position:absolute;top:14%;left:18%;width:30%;height:18%;background:rgba(255,255,255,.6);border-radius:50%;transform:rotate(-25deg);}
    .bol-g2{position:absolute;bottom:12%;right:14%;width:16%;height:9%;background:rgba(255,255,255,.38);border-radius:50%;}
    @keyframes bolSubir{0%{bottom:-120px;opacity:0}5%{opacity:1}30%{transform:translateX(14px)}60%{transform:translateX(-11px)}85%{transform:translateX(8px)}95%{opacity:1}100%{bottom:108%;opacity:0}}
    .anel{position:fixed;pointer-events:none;border-radius:50%;border:3px solid var(--c,#7EC8E6);animation:anelE .45s ease-out forwards;z-index:500;}
    @keyframes anelE{0%{transform:scale(.25);opacity:.9}100%{transform:scale(3.5);opacity:0}}
    .gota{position:fixed;pointer-events:none;border-radius:50%;animation:gotaV .65s ease-out forwards;z-index:500;}
    @keyframes gotaV{0%{transform:translate(0,0);opacity:.9}100%{transform:translate(var(--gx),var(--gy)) scale(0);opacity:0}}
    #combo-msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Nunito',sans-serif;font-weight:900;font-size:2.5rem;pointer-events:none;z-index:600;opacity:0;}
    .combo-show{animation:comboAnim 1.2s ease-out forwards!important;}
    @keyframes comboAnim{0%{transform:translate(-50%,-50%) scale(.5);opacity:1}50%{transform:translate(-50%,-50%) scale(1.3);opacity:1}100%{transform:translate(-50%,-78%) scale(1);opacity:0}}
    .zj-timebar{position:fixed;bottom:0;left:0;right:0;height:5px;z-index:300;background:rgba(126,200,230,.15);}
    .zj-timebar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .9s linear;}
    .zj-overlay{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;background:rgba(45,55,72,.45);backdrop-filter:blur(12px);padding:1rem;}
    .zj-modal{background:var(--white);border-radius:28px;padding:2.2rem 2rem;max-width:360px;width:100%;text-align:center;border:2px solid rgba(126,200,230,.18);box-shadow:0 20px 60px rgba(45,55,72,.18);animation:mIn .38s cubic-bezier(.34,1.56,.64,1);}
    @keyframes mIn{from{transform:scale(.85) translateY(16px);opacity:0}to{transform:scale(1);opacity:1}}
    .modal-icon{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--green));margin:0 auto 1rem;display:flex;align-items:center;justify-content:center;}
    .modal-icon svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;}
    .modal-title{font-size:1.5rem;font-weight:900;margin-bottom:.45rem;}
    .modal-sub{font-size:.88rem;color:#7A90A4;line-height:1.55;margin-bottom:1.3rem;}
    .zj-btn{display:block;width:100%;padding:.75rem;border-radius:50px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;border:none;text-decoration:none;text-align:center;transition:all .22s;margin-top:.5rem;}
    .zj-btn-p{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;box-shadow:0 6px 20px rgba(126,200,230,.35);}
    .zj-btn-g{background:transparent;color:#7A90A4;border:2px solid rgba(126,200,230,.28);}
    .zj-btn-g:hover{border-color:var(--blue);color:var(--blue);}
    @keyframes floatUp{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-52px);opacity:0}}
    @keyframes confeteQ{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:.1}}
  </style>
</head>
<body>
  <div id="zj-bg" style="position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;">
    <div style="position:absolute;inset:0;background-image:radial-gradient(circle,rgba(126,200,230,.15) 1.5px,transparent 1.5px);background-size:34px 34px;"></div>
    <div class="bg-s" style="width:300px;height:300px;background:#7EC8E6;top:-80px;left:-80px;--d:13s;"></div>
    <div class="bg-s" style="width:190px;height:190px;background:#FFE66D;top:10%;right:-55px;--d:17s;border-radius:40% 60%;"></div>
    <div class="bg-s" style="width:240px;height:240px;background:#A8D5BA;bottom:15%;left:-65px;--d:11s;"></div>
  </div>

  <nav class="zj-nav">
    <a href="/menuJogos" class="zj-logo">Zupi<b>.</b></a>
    <div class="zj-hud">
      <div class="zj-pill" id="p">0 pts</div>
      <div class="zj-pill">Vidas <span id="v">3</span></div>
      <div class="zj-pill">Nivel <span id="n">1</span></div>
    </div>
  </nav>

  <div id="ga" class="ga"></div>
  <div id="combo-msg"></div>
  <div class="zj-timebar"><div class="zj-timebar-fill" id="tb" style="width:100%"></div></div>

  <div class="zj-overlay" id="oi">
    <div class="zj-modal">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="9" r="2" fill="#fff" stroke="none"/></svg>
      </div>
      <div class="modal-title">Estoura Bolhas!</div>
      <div class="modal-sub">Toque nas bolhas antes que voem! Combos valem mais pontos!</div>
      <button class="zj-btn zj-btn-p" onclick="iniciar()">Comecar!</button>
      <a href="/menuJogos" class="zj-btn zj-btn-g">Menu</a>
    </div>
  </div>

  <div class="zj-overlay" id="of" style="display:none">
    <div class="zj-modal">
      <div class="modal-icon" id="fim-icon" style="background:linear-gradient(135deg,#FFE66D,#FFB980)">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
      </div>
      <div class="modal-title" id="ft">Fim!</div>
      <div class="modal-sub" id="fs"></div>
      <button class="zj-btn zj-btn-p" onclick="reiniciar()">Jogar novamente</button>
      <a href="/menuJogos" class="zj-btn zj-btn-g">Menu</a>
    </div>
  </div>

  <script>
    var CORES=[
      {bg:'rgba(126,200,230,OP)',bd:'#7EC8E6',pts:10},
      {bg:'rgba(168,213,186,OP)',bd:'#A8D5BA',pts:12},
      {bg:'rgba(255,230,109,OP)',bd:'#FFE66D',pts:15},
      {bg:'rgba(255,185,128,OP)',bd:'#FFB980',pts:18}
    ];
    var pts=0,vidas=3,nivel=1,combo=0,ultCombo=0,rodando=false,ba=0;
    var spInt,tmInt,tmTotal,tmRest;
    var ga=document.getElementById('ga'),comboEl=document.getElementById('combo-msg');

    function iniciar(){document.getElementById('oi').style.display='none';pts=0;vidas=3;nivel=1;combo=0;rodando=true;ba=0;atualizar();iniciarNivel();}
    function iniciarNivel(){
      document.getElementById('n').textContent=nivel;
      tmTotal=30+nivel*6;tmRest=tmTotal;
      clearInterval(spInt);clearInterval(tmInt);
      spInt=setInterval(spawnBol,Math.max(450,1300-nivel*85));
      tmInt=setInterval(function(){
        tmRest--;
        document.getElementById('tb').style.width=(tmRest/tmTotal*100)+'%';
        if(tmRest<=0){nivel++;iniciarNivel();}
      },1000);
      for(var i=0;i<Math.min(nivel+1,4);i++) setTimeout(spawnBol,i*200);
    }
    function spawnBol(){
      if(!rodando||ba>13+nivel) return;
      var c=CORES[Math.floor(Math.random()*CORES.length)];
      var tam=55+Math.random()*55,vida=Math.max(2200,5500-nivel*270);
      var left=4+Math.random()*88,op=.5+Math.random()*.28;
      var b=document.createElement('div');b.className='bol';
      var bgc=c.bg.replace('OP',op);
      b.style.cssText='width:'+tam+'px;height:'+tam+'px;left:'+left+'%;background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.6),'+bgc+' 50%);border:1.5px solid '+c.bd+'55;box-shadow:0 0 '+(tam*.25)+'px '+c.bd+'44;animation-duration:'+vida+'ms;';
      b.innerHTML='<div class="bol-gl"></div><div class="bol-g2"></div>';
      b._c=c;b._tam=tam;ba++;
      b.addEventListener('click',function(e){e.stopPropagation();estouro(b,c,e.clientX,e.clientY);});
      b.addEventListener('touchstart',function(e){e.preventDefault();estouro(b,c,e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
      b.addEventListener('animationend',function(){if(b.parentNode){b.parentNode.removeChild(b);ba=Math.max(0,ba-1);if(rodando){vidas--;atualizar();if(vidas<=0)fim();}}});
      ga.appendChild(b);
    }
    function estouro(b,c,cx,cy){
      if(!b.parentNode||!rodando) return;
      var r=b.getBoundingClientRect();var bx=r.left+r.width/2;var by=r.top+r.height/2;var tam=r.width;
      b.parentNode.removeChild(b);ba=Math.max(0,ba-1);
      // anel
      var ag=document.createElement('div');ag.className='anel';
      ag.style.cssText='left:'+bx+'px;top:'+by+'px;width:'+tam+'px;height:'+tam+'px;margin:'+(-tam/2)+'px 0 0 '+(-tam/2)+'px;--c:'+c.bd;
      document.body.appendChild(ag);setTimeout(function(){if(ag.parentNode)ag.parentNode.removeChild(ag);},500);
      // gotas
      for(var i=0;i<10;i++){(function(idx){
        var g=document.createElement('div');g.className='gota';
        var ang=(idx/10)*Math.PI*2,d=28+Math.random()*48;
        g.style.cssText='left:'+bx+'px;top:'+by+'px;width:'+(5+Math.random()*7)+'px;height:'+(5+Math.random()*7)+'px;background:'+c.bd+';margin:-3px 0 0 -3px;--gx:'+Math.cos(ang)*d+'px;--gy:'+Math.sin(ang)*d+'px;';
        document.body.appendChild(g);setTimeout(function(){if(g.parentNode)g.parentNode.removeChild(g);},700);
      })(i);}
      var agora=Date.now();
      if(agora-ultCombo<1600) combo++;else combo=1;
      ultCombo=agora;
      var bonus=combo>1?combo:1;
      var p=(c.pts+Math.floor(nivel*1.5))*bonus;
      pts+=p;atualizar();
      zupiFloat(bx,by,'+'+p,c.bd);
      zupiTone(440+combo*30,'sine',.15);
      if(combo>=3){
        var msgs={3:'COMBO x3!',4:'COMBO x4!',5:'SUPER COMBO!'};
        comboEl.textContent=msgs[Math.min(combo,5)]||'COMBO x'+combo+'!';
        comboEl.style.color=['#FFE66D','#7EC8E6','#A8D5BA','#FFB980'][Math.floor(Math.random()*4)];
        comboEl.classList.remove('combo-show');void comboEl.offsetWidth;comboEl.classList.add('combo-show');
      }
    }
    function atualizar(){
      document.getElementById('p').textContent=pts+' pts';
      document.getElementById('v').textContent=Math.max(0,vidas);
    }
    function fim(){
      rodando=false;clearInterval(spInt);clearInterval(tmInt);ga.innerHTML='';ba=0;
      document.getElementById('ft').textContent=pts>300?'Incrivel!!':pts>150?'Muito bom!':'Continue tentando!';
      document.getElementById('fs').textContent=pts+' pontos! Nivel '+nivel+' alcancado!';
      document.getElementById('of').style.display='flex';
      if(pts>100) zupiConfete(30);
    }
    function reiniciar(){document.getElementById('of').style.display='none';ga.innerHTML='';ba=0;iniciar();}

    var _ac;function _gac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();return _ac;}
    function zupiTone(f,t,v){try{var c=_gac(),tm=c.currentTime;var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;o.type=t||'sine';g.gain.setValueAtTime(v||.15,tm);g.gain.exponentialRampToValueAtTime(.001,tm+.18);o.start(tm);o.stop(tm+.18);}catch(e){}}
    function zupiFloat(x,y,txt,cor){var el=document.createElement('div');el.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;color:'+(cor||'#7EC8E6')+';font-family:Nunito,sans-serif;font-weight:900;font-size:1.1rem;pointer-events:none;z-index:900;animation:floatUp .9s ease-out forwards;transform:translateX(-50%);';el.textContent=txt;document.body.appendChild(el);setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},950);}
    function zupiConfete(q){var c=['#7EC8E6','#A8D5BA','#FFE66D','#FFB980'];for(var i=0;i<q;i++){var el=document.createElement('div');var dur=(1.4+Math.random()*1.8).toFixed(2);var del=(Math.random()*.8).toFixed(2);el.style.cssText='position:fixed;left:'+Math.random()*100+'vw;top:-20px;width:'+(7+Math.random()*10)+'px;height:'+(7+Math.random()*10)+'px;background:'+c[Math.floor(Math.random()*c.length)]+';border-radius:'+(Math.random()>.5?'50%':'3px')+';pointer-events:none;z-index:800;animation:confeteQ '+dur+'s ease-in '+del+'s forwards;';document.body.appendChild(el);setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},(parseFloat(dur)+parseFloat(del))*1000+200);}}
    var st=document.createElement('style');st.textContent='@keyframes floatUp{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-52px);opacity:0}}@keyframes confeteQ{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:.1}}';document.head.appendChild(st);
  </script>
  <script src="/js/routes.js"></script><script src="/js/api.js"></script><script src="/js/auth-guard.js"></script><script src="/js/game-guard.js"></script><script src="/js/game-score.js"></script>
</body>
</html>
