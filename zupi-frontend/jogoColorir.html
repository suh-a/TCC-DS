<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Atelie de Colorir - Zupi</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/jogoColorir.css">
</head>
<body>
  <div class="paint-bg" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>
  <nav class="paint-nav">
    <a href="/menuJogos" class="paint-brand">Zupi<b>.</b></a>
    <div class="paint-hud">
      <span class="paint-pill">Nivel <b id="nivel">1</b></span>
      <span class="paint-pill"><b id="progresso">0</b>% pintado</span>
    </div>
  </nav>
  <main class="colorir-wrap">
    <section class="paint-tools" aria-label="Paleta de cores">
      <h1>Atelie de Colorir</h1>
      <p>Escolha uma cor e toque nas partes do desenho.</p>
      <div class="paleta" id="paleta"></div>
      <div class="paint-actions">
        <button class="tool-btn" id="desfazer" type="button">Desfazer</button>
        <button class="tool-btn" id="limpar" type="button">Limpar</button>
      </div>
    </section>
    <section class="desenho-area">
      <header class="desenho-header">
        <button class="nav-btn" id="anterior" type="button" aria-label="Desenho anterior">&#8249;</button>
        <div>
          <strong id="titulo-desenho">Jardim feliz</strong>
          <span id="missao">Pinte 6 partes para liberar o proximo nivel!</span>
        </div>
        <button class="nav-btn" id="proximo" type="button" aria-label="Proximo desenho">&#8250;</button>
      </header>
      <div class="svg-container" id="desenho" aria-live="polite"></div>
      <div class="paint-progress"><span id="barra"></span></div>
    </section>
  </main>
  <div class="level-toast" id="level-toast" role="status">
    <strong>Novo nivel!</strong>
    <span id="level-message"></span>
  </div>
  <script src="/js/jogoColorir.js"></script>
  <script src="/js/routes.js"></script><script src="/js/api.js"></script><script src="/js/auth-guard.js"></script><script src="/js/game-guard.js"></script><script src="/js/game-score.js"></script>
</body>
</html>
