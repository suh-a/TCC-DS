<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz Inicial - Zupi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <style>
    .quiz-card {
      background: white;
      border-radius: 18px;
      padding: 2rem;
      box-shadow: 0 18px 50px rgba(45, 55, 72, 0.12);
      max-width: 760px;
      margin: 0 auto;
      animation: quizIn .45s ease both;
    }
    .quiz-progress {
      height: 9px;
      border-radius: 999px;
      background: #e9f4f8;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .quiz-progress-bar {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #7EC8E6, #A8D5BA, #FFB980);
      transition: width 0.28s ease;
    }
    .quiz-question {
      color: #2d3748;
      font-size: 1.18rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }
    .quiz-option {
      display: block;
      width: 100%;
      padding: 0.85rem 1rem;
      margin-bottom: 0.6rem;
      border: 2px solid #e5eef3;
      border-radius: 12px;
      background: white;
      color: #2d3748;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
      text-align: left;
      font-size: 0.96rem;
    }
    .quiz-option:hover {
      border-color: #7EC8E6;
      background: #f1f9fc;
      transform: translateY(-1px);
    }
    .quiz-option.selected {
      border-color: #FFB980;
      background: #fff4e9;
      font-weight: 800;
    }
    .credentials-box {
      background: #f0f9fc;
      border: 2px solid rgba(126, 200, 230, 0.45);
      border-radius: 14px;
      padding: 1.5rem;
      text-align: center;
    }
    .credentials-box .credential {
      background: white;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      margin: 0.5rem 0;
      font-family: monospace;
      font-size: 1.05rem;
      border: 1px solid #dfeaf0;
    }
    @keyframes quizIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="auth-page">
  <div class="background-decor" aria-hidden="true">
    <span class="decor-shape decor-circle" style="background-color:#7EC8E6; top:10%; left:15%; width:60px; height:60px;"></span>
    <span class="decor-shape decor-circle" style="background-color:#A8D5BA; top:70%; left:25%; width:45px; height:45px;"></span>
  </div>

  <main class="d-flex align-items-center justify-content-center py-5" style="min-height:100vh;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
          <div id="quizStep" class="quiz-card">
            <h1 class="h3 text-center mb-2">Quiz Inicial</h1>
            <p class="text-center text-muted mb-4">Algumas escolhas rapidas para personalizar a experiencia da crianca.</p>

            <div class="quiz-progress">
              <div class="quiz-progress-bar" id="progressBar" style="width: 10%;"></div>
            </div>

            <p class="text-muted small text-center mb-3">
              Pergunta <span id="currentQ">1</span> de <span id="totalQ">8</span>
            </p>

            <div id="questionContainer">
              <p class="quiz-question" id="questionText"></p>
              <div id="optionsContainer"></div>
            </div>

            <div class="d-flex justify-content-between mt-4">
              <button class="btn btn-outline-secondary" id="prevBtn" type="button" onclick="prevQuestion()" disabled>Anterior</button>
              <button class="btn btn-primary" id="nextBtn" type="button" onclick="nextQuestion()">Proxima</button>
            </div>
          </div>

          <div id="resultStep" class="quiz-card d-none">
            <h1 class="h3 text-center mb-2">Quiz concluido</h1>
            <p class="text-center text-muted mb-4" id="quizSummary">Analise gerada com sucesso.</p>

            <div class="credentials-box mb-4">
              <h5 class="mb-3">Acesso infantil gerado</h5>
              <p class="text-muted small">Anote as credenciais abaixo para a crianca acessar o perfil dela:</p>
              <div class="credential" id="childEmail">-</div>
              <div class="credential" id="childPassword">-</div>
            </div>

            <div class="d-grid gap-2">
              <a href="/menuJogos" class="btn btn-primary btn-lg" id="recommendedGamesLink">Ver jogos sugeridos</a>
              <a href="/dashboard-pais" class="btn btn-outline-secondary">Voltar ao Dashboard</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="/js/routes.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script>
    const QUESTIONS = [
      {
        text: 'Quando tem uma atividade nova, o que costuma chamar mais atencao?',
        options: [
          { label: 'Cores, formas e imagens', tags: ['visual', 'art'] },
          { label: 'Sons, ritmos e repeticoes', tags: ['audio', 'memory'] },
          { label: 'Numeros, ordem e desafios logicos', tags: ['math', 'logic'] },
          { label: 'Movimento, cliques e respostas rapidas', tags: ['motor', 'attention'] }
        ]
      },
      {
        text: 'Em uma brincadeira tranquila, a crianca prefere:',
        options: [
          { label: 'Encontrar pares ou lembrar sequencias', tags: ['memory'] },
          { label: 'Montar caminhos e descobrir padroes', tags: ['planning', 'logic'] },
          { label: 'Pintar, combinar cores ou criar cenas', tags: ['art', 'visual'] },
          { label: 'Contar objetos ou organizar numeros', tags: ['math'] }
        ]
      },
      {
        text: 'Qual tipo de desafio prende a atencao por mais tempo?',
        options: [
          { label: 'Um objetivo claro e curto', tags: ['attention', 'motor'] },
          { label: 'Uma descoberta visual passo a passo', tags: ['visual', 'planning'] },
          { label: 'Uma regra para testar varias vezes', tags: ['logic', 'memory'] },
          { label: 'Uma tarefa criativa sem pressa', tags: ['art'] }
        ]
      },
      {
        text: 'Quando erra, costuma funcionar melhor:',
        options: [
          { label: 'Tentar de novo rapidinho', tags: ['motor', 'attention'] },
          { label: 'Ver uma pista visual', tags: ['visual'] },
          { label: 'Repetir a mesma sequencia', tags: ['memory', 'audio'] },
          { label: 'Resolver em partes menores', tags: ['math', 'planning'] }
        ]
      },
      {
        text: 'Em momentos de energia alta, a crianca tende a gostar de:',
        options: [
          { label: 'Acertar alvos ou estourar elementos', tags: ['motor', 'attention'] },
          { label: 'Controlar direcao e movimento', tags: ['motor', 'planning'] },
          { label: 'Escolher cores certas', tags: ['attention', 'visual'] },
          { label: 'Criar algo colorido', tags: ['art'] }
        ]
      },
      {
        text: 'Em momentos de foco calmo, combina mais com:',
        options: [
          { label: 'Memorizar imagens', tags: ['memory', 'visual'] },
          { label: 'Formar palavras ou reconhecer letras', tags: ['language'] },
          { label: 'Resolver continhas ou contagens', tags: ['math'] },
          { label: 'Ligar ideias parecidas', tags: ['association', 'visual'] }
        ]
      },
      {
        text: 'Que tipo de recompensa visual parece animar mais?',
        options: [
          { label: 'Desenhos e pinturas ficando completos', tags: ['art'] },
          { label: 'Pecas se encaixando', tags: ['logic', 'visual'] },
          { label: 'Pontuacao subindo rapido', tags: ['motor', 'attention'] },
          { label: 'Sequencias ficando corretas', tags: ['memory', 'planning'] }
        ]
      },
      {
        text: 'Se pudesse escolher uma exploracao, seria mais parecida com:',
        options: [
          { label: 'Um atelie de cores', tags: ['art', 'visual'] },
          { label: 'Uma trilha com caminho certo', tags: ['planning'] },
          { label: 'Um jogo de lembrar e comparar', tags: ['memory'] },
          { label: 'Uma missao de numeros e letras', tags: ['math', 'language'] }
        ]
      }
    ];

    let currentIndex = 0;
    let answers = {};
    let answerTags = {};
    let childId = null;

    document.addEventListener('DOMContentLoaded', function() {
      if (!ZupiAPI.requireAuth()) return;
      childId = new URLSearchParams(window.location.search).get('childId');
      if (!childId) {
        alert('ID da crianca nao encontrado.');
        window.location.href = '/dashboard-pais';
        return;
      }
      localStorage.setItem('activeChildId', String(childId));
      localStorage.setItem('selectedChildId', String(childId));
      localStorage.setItem('childId', String(childId));
      document.getElementById('totalQ').textContent = QUESTIONS.length;
      renderQuestion();
      ZupiAPI.post(`/quiz/child/${childId}`).catch(() => {});
    });

    function renderQuestion() {
      const q = QUESTIONS[currentIndex];
      document.getElementById('questionText').textContent = q.text;
      document.getElementById('currentQ').textContent = currentIndex + 1;
      document.getElementById('progressBar').style.width = ((currentIndex + 1) / QUESTIONS.length * 100) + '%';

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option';
        btn.type = 'button';
        btn.textContent = opt.label;
        if (answers[q.text] === opt.label) btn.classList.add('selected');
        btn.addEventListener('click', () => selectOption(q.text, opt, btn));
        container.appendChild(btn);
      });

      document.getElementById('prevBtn').disabled = currentIndex === 0;
      document.getElementById('nextBtn').textContent = currentIndex === QUESTIONS.length - 1 ? 'Finalizar' : 'Proxima';
    }

    function selectOption(question, answer, btn) {
      answers[question] = answer.label;
      answerTags[question] = answer.tags || [];
      document.querySelectorAll('.quiz-option').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function nextQuestion() {
      const q = QUESTIONS[currentIndex];
      if (!answers[q.text]) {
        alert('Selecione uma resposta antes de continuar.');
        return;
      }
      if (currentIndex < QUESTIONS.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        submitQuiz();
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    async function submitQuiz() {
      try {
        const recommendations = buildQuizRecommendations(answerTags);
        saveQuizRecommendations(childId, recommendations);

        const resp = await ZupiAPI.post('/quiz/complete', {
          childId: parseInt(childId, 10),
          answers,
          preferenceTags: answerTags,
          recommendations
        });

        if (resp && resp.ok) {
          const data = await resp.json();
          document.getElementById('quizSummary').textContent = data.summary || recommendations.summary;
          document.getElementById('childEmail').textContent = data.childLoginEmail || 'Nao gerado';
          document.getElementById('childPassword').textContent = data.generatedPassword || 'Nao gerada';
        } else {
          document.getElementById('quizSummary').textContent = recommendations.summary;
        }

        const childResp = await ZupiAPI.get(`/child/details/${childId}`);
        if (childResp && childResp.ok && document.getElementById('childEmail').textContent === '-') {
          const child = await childResp.json();
          document.getElementById('childEmail').textContent = child.childLoginEmail || 'Nao gerado';
        }
        document.getElementById('recommendedGamesLink').href = `/menuJogos?childId=${childId}`;

        document.getElementById('quizStep').classList.add('d-none');
        document.getElementById('resultStep').classList.remove('d-none');
      } catch (e) {
        console.error('Erro ao enviar quiz:', e);
        alert('Erro ao enviar quiz. Tente novamente.');
      }
    }

    function buildQuizRecommendations(tagMap) {
      const tagScores = {};
      Object.values(tagMap).flat().forEach(tag => {
        tagScores[tag] = (tagScores[tag] || 0) + 1;
      });

      const catalog = [
        { href: '/jogoMemoria', tags: ['memory', 'visual'], reason: 'memoria visual e comparacao' },
        { href: '/jogoSequenciaSons', tags: ['audio', 'memory'], reason: 'sequencia auditiva' },
        { href: '/jogoPadroes', tags: ['logic', 'visual'], reason: 'padroes e raciocinio' },
        { href: '/jogoRotas', tags: ['planning', 'logic'], reason: 'planejamento de caminho' },
        { href: '/jogoMath', tags: ['math'], reason: 'numeros e calculos simples' },
        { href: '/jogoContagem', tags: ['math', 'visual'], reason: 'contagem visual' },
        { href: '/jogoPalavras', tags: ['language'], reason: 'formacao de palavras' },
        { href: '/jogoLetra', tags: ['language', 'visual'], reason: 'reconhecimento de letras' },
        { href: '/jogoColorir', tags: ['art', 'visual'], reason: 'criatividade com cores' },
        { href: '/jogoPintura', tags: ['art'], reason: 'mistura de cores' },
        { href: '/jogoMosaico', tags: ['art', 'logic', 'visual'], reason: 'criacao com padroes' },
        { href: '/jogoCenarios', tags: ['art', 'planning'], reason: 'criacao de cenas' },
        { href: '/jogo-cores-formas', tags: ['visual', 'association'], reason: 'cores, formas e associacao' },
        { href: '/jogo-ligar-objetos', tags: ['association', 'visual'], reason: 'associacao entre ideias' },
        { href: '/jogoBolhas', tags: ['attention', 'motor'], reason: 'atencao e resposta rapida' },
        { href: '/jogoClique', tags: ['attention', 'motor'], reason: 'reflexo e foco' },
        { href: '/jogoBalao', tags: ['attention', 'visual'], reason: 'cores com atencao' },
        { href: '/jogoCatch', tags: ['motor', 'attention'], reason: 'coordenacao e movimento' },
        { href: '/jogoBolao', tags: ['motor', 'planning'], reason: 'mira e controle' },
        { href: '/jogoSombras', tags: ['visual', 'association'], reason: 'comparacao visual' },
        { href: '/jogoOrdem', tags: ['math', 'planning'], reason: 'sequencia numerica' },
        { href: '/jogoFocoCores', tags: ['attention', 'visual'], reason: 'controle de atencao' },
        { href: '/jogoBomba', tags: ['attention', 'motor'], reason: 'controle inibitorio' }
      ];

      const games = catalog.map(game => ({
        ...game,
        score: game.tags.reduce((sum, tag) => sum + (tagScores[tag] || 0), 0)
      }))
        .filter(game => game.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 6);

      const selected = games.length ? games : catalog.slice(0, 4).map(game => ({ ...game, score: 1 }));
      return {
        childId: String(childId),
        tags: tagScores,
        games: selected,
        createdAt: new Date().toISOString(),
        summary: `Perfil personalizado gerado. Destacamos ${selected.length} jogos que combinam com as preferencias observadas no quiz.`
      };
    }

    function saveQuizRecommendations(childId, recommendations) {
      const key = 'zupiGameRecommendations';
      let data = {};
      try {
        data = JSON.parse(localStorage.getItem(key) || '{}') || {};
      } catch (e) {
        data = {};
      }
      data[String(childId)] = recommendations;
      localStorage.setItem(key, JSON.stringify(data));
    }
  </script>
</body>
</html>
