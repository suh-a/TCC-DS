<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧺 Pega Frutas — Zupi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/zupi-games-theme.css">
  <link rel="stylesheet" href="/css/jogoCatch.css">
</head>
<body class="zj-body">
<a href="/menuJogos" class="z-back-btn">⬅ Menu</a>
<div class="z-hud">
  <div class="z-hud-item"><div class="z-hud-label">⭐ Pontos</div><div class="z-hud-value" id="pts" style="color:var(--z-blue)">0</div></div>
  <div class="z-hud-item"><div class="z-hud-label">❤️ Vidas</div><div class="z-hud-value" id="vidas" style="color:var(--z-coral)">❤️❤️❤️</div></div>
  <div class="z-hud-item"><div class="z-hud-label">🌟 Nível</div><div class="z-hud-value" id="niv" style="color:var(--z-green)">1</div></div>
</div>

<canvas id="game-canvas"></canvas>

<!-- TOUCH CONTROLS -->
<div class="touch-area" id="touch-area">
  <div class="touch-btn" id="t-left" ontouchstart="teclas.left=true" ontouchend="teclas.left=false">◀</div>
  <div class="touch-btn" id="t-right" ontouchstart="teclas.right=true" ontouchend="teclas.right=false">▶</div>
</div>

<!-- OVERLAY INÍCIO -->
<div class="z-overlay" id="ov-inicio">
  <div class="z-overlay-card">
    <div style="font-size:5rem;animation:zBounce 1s infinite alternate">🧺</div>
    <h2 style="font-weight:800;margin:.5rem 0">Pega Frutas!</h2>
    <p style="color:#7a8ea0;margin-bottom:1.5rem">Use as setas ← → ou toque nos botões para mover a cesta e pegar as frutas! Não deixe cair! 🍎🍌🍓</p>
    <button class="z-btn z-btn-primary" onclick="iniciar()">🚀 Jogar!</button>
  </div>
</div>
<div class="z-overlay" id="ov-fim" style="display:none">
  <div class="z-overlay-card">
    <div style="font-size:5rem;animation:zBounce 1s infinite alternate" id="fim-e">😢</div>
    <h2 style="font-weight:800;margin:.5rem 0" id="fim-t">Fim!</h2>
    <p style="color:#7a8ea0;margin-bottom:1.5rem" id="fim-s">Pontuação: 0</p>
    <button class="z-btn z-btn-primary" onclick="reiniciar()">🔄 Novamente</button>
    <a href="/menuJogos" class="z-btn z-btn-ghost" style="margin-top:.5rem;display:block">⬅ Menu</a>
  </div>
</div>

<script th:inline="none">
/*<![CDATA[*/

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

const FRUTAS = ['🍎','🍌','🍓','🍊','🍇','🍑','🥝','🍒','🍋','🫐'];
const VENENOS = ['💀','🌑','⚡'];
let W,H,cesta,itens=[],pts=0,vidas=3,nivel=1,jogando=false,animId;
const teclas={left:false,right:false};

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight-60;
}
window.addEventListener('resize',resize);
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')teclas.left=true;if(e.key==='ArrowRight')teclas.right=true;});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')teclas.left=false;if(e.key==='ArrowRight')teclas.right=false;});

// Touch drag
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=e.touches[0];
  cesta.x=t.clientX-cesta.w/2;
},{passive:false});

let spawnTimer=0,nivelTimer=0;

function iniciar(){
  document.getElementById('ov-inicio').style.display='none';
  resize();
  pts=0;vidas=3;nivel=1;itens=[];
  cesta={x:W/2-50,y:H-80,w:100,h:55,speed:7};
  jogando=true;
  atualizarHUD();
  if(animId) cancelAnimationFrame(animId);
  loop();
}

function loop(){
  if(!jogando) return;
  ctx.clearRect(0,0,W,H);

  // Fundo gradiente suave
  const grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#D4EEFF');
  grd.addColorStop(1,'#E8F8F0');
  ctx.fillStyle=grd;
  ctx.fillRect(0,0,W,H);

  // Mover cesta
  const sp = cesta.speed + nivel*0.5;
  if(teclas.left) cesta.x=Math.max(0, cesta.x-sp);
  if(teclas.right) cesta.x=Math.min(W-cesta.w, cesta.x+sp);

  // Spawn
  spawnTimer++;
  const spawnRate = Math.max(30, 90-nivel*6);
  if(spawnTimer>=spawnRate){ spawnTimer=0; spawnItem(); }

  // Atualizar itens
  const vel = 2.5 + nivel*0.4;
  itens = itens.filter(item=>{
    item.y += vel + item.extraVel;
    if(item.y > H-70){
      // Colisão com cesta
      if(item.x > cesta.x-30 && item.x < cesta.x+cesta.w+30){
        if(item.isVeneno){ perderVida(); spawnExplosao(item.x,H-70,'💥'); }
        else { pts+=item.pts; atualizarHUD(); spawnExplosao(item.x,H-70,'✨'); somCaptura(); }
        return false;
      } else {
        if(!item.isVeneno){ perderVida(); }
        return false;
      }
    }
    // Desenhar
    ctx.font=`${item.size}px serif`;
    ctx.textAlign='center';
    ctx.fillText(item.emoji, item.x, item.y);
    return true;
  });

  // Explosões
  explosoes = explosoes.filter(e=>{
    e.t++;
    ctx.font=`${e.size+e.t}px serif`;
    ctx.globalAlpha=Math.max(0,1-e.t/20);
    ctx.fillText(e.emoji,e.x,e.y-e.t*2);
    ctx.globalAlpha=1;
    return e.t<20;
  });

  // Cesta
  desenharCesta();

  // Nível
  nivelTimer++;
  if(nivelTimer>400+nivel*50){ nivelTimer=0; nivel++; atualizarHUD(); mostrarNivel(); }

  animId=requestAnimationFrame(loop);
}

let explosoes=[];
function spawnExplosao(x,y,emoji){ explosoes.push({x,y,emoji,t:0,size:28}); }

function spawnItem(){
  const isVeneno = Math.random()<(0.1+nivel*0.02);
  const emoji = isVeneno ? VENENOS[Math.floor(Math.random()*VENENOS.length)] : FRUTAS[Math.floor(Math.random()*FRUTAS.length)];
  itens.push({x:50+Math.random()*(W-100),y:-30,emoji,size:36+Math.random()*12,isVeneno,pts:10+nivel*5,extraVel:Math.random()*1.5});
}

function desenharCesta(){
  const x=cesta.x,y=cesta.y,w=cesta.w,h=cesta.h;
  // Corpo da cesta
  ctx.beginPath();
  ctx.moveTo(x+8,y); ctx.lineTo(x+w-8,y);
  ctx.quadraticCurveTo(x+w+5,y+h/2,x+w,y+h);
  ctx.lineTo(x,y+h);
  ctx.quadraticCurveTo(x-5,y+h/2,x+8,y);
  ctx.fillStyle='#C4956A';
  ctx.fill();
  // Listras da cesta
  ctx.strokeStyle='#A07040'; ctx.lineWidth=1.5;
  for(let i=0;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(x+w*i/4,y);
    ctx.lineTo(x+w*i/4,y+h);
    ctx.stroke();
  }
  // Borda superior
  ctx.beginPath();
  ctx.roundRect(x-3,y-8,w+6,14,4);
  ctx.fillStyle='#8B5E3C'; ctx.fill();
  // Alça
  ctx.beginPath();
  ctx.arc(x+w/2,y-8,w*0.35,Math.PI,0);
  ctx.strokeStyle='#8B5E3C'; ctx.lineWidth=5; ctx.stroke();
}

function perderVida(){
  vidas--;
  atualizarHUD();
  somErro();
  // Flash vermelho
  ctx.fillStyle='rgba(255,100,100,0.15)';
  ctx.fillRect(0,0,W,H);
  if(vidas<=0) fimDeJogo();
}

function atualizarHUD(){
  document.getElementById('pts').textContent=pts;
  document.getElementById('vidas').textContent='❤️'.repeat(Math.max(0,vidas))||'💔';
  document.getElementById('niv').textContent=nivel;
}

let nivelMsgTimer=0;
function mostrarNivel(){
  nivelMsgTimer=60;
}

function fimDeJogo(){
  jogando=false;
  cancelAnimationFrame(animId);
  const f=document.getElementById('ov-fim');
  document.getElementById('fim-e').textContent=pts>300?'🏆':pts>150?'⭐':'😢';
  document.getElementById('fim-t').textContent=pts>300?'Incrível!!':pts>150?'Muito bom!':'Tente novamente!';
  document.getElementById('fim-s').textContent=`${pts} pontos 🎯 | Nível ${nivel}`;
  f.style.display='flex';
}

function reiniciar(){
  document.getElementById('ov-fim').style.display='none';
  iniciar();
}

// Áudio
let actx;
function getAC(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}
function somCaptura(){
  try{const c=getAC(),t=c.currentTime;const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=523+Math.random()*200;o.type='sine';g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.start(t);o.stop(t+.12);}catch(e){}
}
function somErro(){
  try{const c=getAC(),t=c.currentTime;const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=180;o.type='sawtooth';g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.start(t);o.stop(t+.35);}catch(e){}
}

/*]]>*/
</script>
  <script src="/js/routes.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth-guard.js"></script>

  <script src="/js/game-guard.js"></script>

  <script src="/js/game-score.js"></script>
</body>
</html>
