<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hora de Colorir - Zupi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/zupi-jogos.css">
  <style>
    body.zj-body{overflow:hidden;}
    .col-wrap{display:flex;height:calc(100vh - 58px);margin-top:58px;gap:0;}
    /* PAINEL LATERAL */
    .col-side{width:170px;flex-shrink:0;background:rgba(255,255,255,.92);border-right:2px solid rgba(126,200,230,.2);display:flex;flex-direction:column;gap:.65rem;padding:.75rem .6rem;overflow-y:auto;}
    .cs-label{font-size:.65rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#7EC8E6;text-align:center;font-family:'Poppins',sans-serif;}
    .cor-preview{width:48px;height:48px;border-radius:50%;margin:0 auto;border:3px solid rgba(126,200,230,.35);box-shadow:0 3px 10px rgba(0,0,0,.12);transition:background .2s;}
    .paleta{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
    .pc{width:100%;aspect-ratio:1;border-radius:7px;border:2.5px solid transparent;cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1);}
    .pc:hover{transform:scale(1.15);}
    .pc.ativo{border-color:white;box-shadow:0 0 0 2.5px #7EC8E6,0 3px 10px rgba(0,0,0,.2);transform:scale(1.18);}
    .pinceis{display:flex;gap:4px;justify-content:center;align-items:flex-end;}
    .pb{border-radius:50%;background:white;border:2px solid rgba(126,200,230,.35);cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;}
    .pb.ativo{border-color:#7EC8E6;background:#7EC8E6;}
    .ferramentas{display:flex;flex-direction:column;gap:5px;}
    .fb{padding:.38rem .4rem;border-radius:9px;border:2px solid rgba(126,200,230,.28);background:rgba(126,200,230,.07);color:#2D3748;font-family:'Poppins',sans-serif;font-weight:600;font-size:.75rem;cursor:pointer;transition:all .2s;text-align:center;}
    .fb:hover{background:rgba(126,200,230,.2);}
    .fb.ativo{background:linear-gradient(135deg,#7EC8E6,#A8D5BA);color:white;border-color:transparent;}
    /* FIGURAS MINIATURAS */
    .figs-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;}
    .fig-btn{width:36px;height:32px;border-radius:8px;border:2px solid rgba(126,200,230,.25);background:white;cursor:pointer;transition:all .2s;font-size:1.1rem;display:flex;align-items:center;justify-content:center;}
    .fig-btn:hover{border-color:#FFB980;transform:scale(1.1);}
    .fig-btn.ativo{border-color:#7EC8E6;box-shadow:0 0 0 2px #7EC8E6;}
    /* CANVAS */
    .col-canvas-wrap{flex:1;background:white;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
    #col-canvas{cursor:crosshair;touch-action:none;max-width:100%;max-height:100%;}
    /* TOP BAR CANVAS */
    .col-topbar{position:absolute;top:.5rem;right:.5rem;display:flex;gap:.4rem;}
    .col-topbtn{padding:.3rem .8rem;border-radius:50px;font-family:'Poppins',sans-serif;font-weight:600;font-size:.75rem;border:1.5px solid rgba(126,200,230,.3);background:rgba(255,255,255,.9);color:#2D3748;cursor:pointer;transition:all .2s;backdrop-filter:blur(4px);}
    .col-topbtn:hover{background:#7EC8E6;color:white;}
    @media(max-width:640px){
      .col-wrap{flex-direction:column;height:auto;overflow:auto;}
      .col-side{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;}
      .paleta{grid-template-columns:repeat(8,1fr);}
      .col-canvas-wrap{height:55vw;min-height:260px;}
    }
  </style>
</head>
<body class="zj-body">
<div id="zj-sky" class="zj-sky"></div>
<nav class="zj-nav">
  <a href="/menuJogos" class="zj-brand">&#x1F43E; Zupi &#x2014; Colorir</a>
  <div class="zj-stats">
    <div class="zj-pill">&#x1F3A8; Pintando!</div>
  </div>
</nav>

<div class="col-wrap">
  <!-- PAINEL LATERAL -->
  <aside class="col-side">
    <div>
      <div class="cs-label">Sua cor</div>
      <div class="cor-preview" id="cor-prev" style="background:#7EC8E6"></div>
    </div>
    <div>
      <div class="cs-label">Paleta</div>
      <div class="paleta" id="paleta"></div>
    </div>
    <div>
      <div class="cs-label">Pincel</div>
      <div class="pinceis" id="pinceis"></div>
    </div>
    <div>
      <div class="cs-label">Ferramenta</div>
      <div class="ferramentas">
        <button class="fb ativo" id="f-pincel" onclick="setFerr('pincel',this)">&#x270F;&#xFE0F; Pincel</button>
        <button class="fb" id="f-balde" onclick="setFerr('balde',this)">&#x1FAA3; Balde</button>
        <button class="fb" id="f-borracha" onclick="setFerr('borracha',this)">&#x1F9F9; Borracha</button>
      </div>
    </div>
    <div>
      <div class="cs-label">Figuras</div>
      <div class="figs-row" id="figs-row"></div>
    </div>
  </aside>

  <!-- CANVAS -->
  <div class="col-canvas-wrap">
    <canvas id="col-canvas"></canvas>
    <div class="col-topbar">
      <button class="col-topbtn" onclick="limpar()">&#x1F5D1;&#xFE0F; Limpar</button>
      <button class="col-topbtn" onclick="salvar()">&#x1F4BE; Salvar PNG</button>
    </div>
  </div>
</div>

<script src="/js/zupi-sky.js"></script>
<script th:inline="none">
// Paleta
var CORES=['#FF6B6B','#FF9F1C','#FFE66D','#A8D5BA','#7EC8E6','#4D96FF','#C8B8F0','#F9C6D0','#FF85A1','#8B5E3C','#2D3748','#FFFFFF','#E74C3C','#E67E22','#F1C40F','#2ECC71','#3498DB','#9B59B6','#1ABC9C','#E91E63','#607D8B','#795548','#455A64','#000000'];
// Figuras SVG para colorir
var FIGURAS=[
  {e:'&#x1F98B;',n:'Borboleta',svg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250"><ellipse cx="70" cy="90" rx="65" ry="50" fill="white" stroke="#2D3748" stroke-width="3"/><ellipse cx="230" cy="90" rx="65" ry="50" fill="white" stroke="#2D3748" stroke-width="3"/><ellipse cx="80" cy="160" rx="45" ry="35" fill="white" stroke="#2D3748" stroke-width="3"/><ellipse cx="220" cy="160" rx="45" ry="35" fill="white" stroke="#2D3748" stroke-width="3"/><circle cx="100" cy="80" r="12" fill="white" stroke="#2D3748" stroke-width="2"/><circle cx="200" cy="80" r="12" fill="white" stroke="#2D3748" stroke-width="2"/><ellipse cx="150" cy="125" rx="10" ry="40" fill="white" stroke="#2D3748" stroke-width="2.5"/><line x1="150" y1="85" x2="120" y2="55" stroke="#2D3748" stroke-width="2"/><line x1="150" y1="85" x2="180" y2="55" stroke="#2D3748" stroke-width="2"/><circle cx="118" cy="53" r="4" fill="white" stroke="#2D3748" stroke-width="1.5"/><circle cx="182" cy="53" r="4" fill="white" stroke="#2D3748" stroke-width="1.5"/></svg>'},
  {e:'&#x1F33B;',n:'Girassol',svg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><ellipse cx="150" cy="78" rx="22" ry="38" fill="white" stroke="#2D3748" stroke-width="2.5"/><ellipse cx="195" cy="93" rx="22" ry="38" fill="white" stroke="#2D3748" stroke-width="2.5" transform="rotate(30,195,93)"/><ellipse cx="222" cy="138" rx="22" ry="38" fill="white" stroke="#2D3748" stroke-width="2.5" transform="rotate(60,222,138)"/><ellipse cx="222" cy="188" rx="22" ry="38" fill="white" stroke="#2D3748" stroke-width="2.5" transform="rotate(90,222,188)"/><ellipse cx="195" cy="228" rx="22" ry="38" fill="white" stroke="#2D3748" stroke-width="2.5" transform="rotate(120,195,228)"/><ellipse cx="150" cy="242" rx="22" ry="38" fill="white" stroke="#2D3748" stroke-width="2.5"/><ellipse cx="105" cy="228" rx="22" ry="38" fill="white" stroke="#2D3748" stroke-width="2.5" transform="rotate(-120,105,228)"/><ellipse cx="78" cy="188" rx="22" ry="38" fill="white" stroke="#2D3748" stroke-width="2.5" transform="rotate(-90,78,188)"/><ellipse cx="78" cy="138" rx="22" ry="38" fill="white" stroke="#2D3748" stroke-width="2.5" transform="rotate(-60,78,138)"/><ellipse cx="105" cy="93" rx="22" ry="38" fill="white" stroke="#2D3748" stroke-width="2.5" transform="rotate(-30,105,93)"/><circle cx="150" cy="160" r="52" fill="white" stroke="#2D3748" stroke-width="3"/><circle cx="150" cy="160" r="34" fill="white" stroke="#2D3748" stroke-width="2"/><line x1="150" y1="212" x2="150" y2="295" stroke="#2D3748" stroke-width="4"/></svg>'},
  {e:'&#x1F420;',n:'Peixe',svg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200"><ellipse cx="145" cy="100" rx="105" ry="65" fill="white" stroke="#2D3748" stroke-width="3"/><polygon points="250,100 292,58 292,142" fill="white" stroke="#2D3748" stroke-width="3"/><circle cx="60" cy="83" r="20" fill="white" stroke="#2D3748" stroke-width="2"/><circle cx="55" cy="80" r="8" fill="white" stroke="#2D3748" stroke-width="1.5"/><circle cx="52" cy="78" r="3" fill="#2D3748"/><path d="M 70 138 Q 110 112 150 138" fill="none" stroke="#2D3748" stroke-width="2"/><path d="M 90 123 Q 130 102 170 123" fill="none" stroke="#2D3748" stroke-width="2"/><path d="M 110 110 Q 150 92 190 110" fill="none" stroke="#2D3748" stroke-width="2"/></svg>'},
  {e:'&#x1F3E0;',n:'Casinha',svg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280"><polygon points="150,20 30,118 270,118" fill="white" stroke="#2D3748" stroke-width="3.5"/><rect x="45" y="116" width="210" height="152" fill="white" stroke="#2D3748" stroke-width="3"/><rect x="110" y="176" width="80" height="92" fill="white" stroke="#2D3748" stroke-width="2.5" rx="5"/><rect x="65" y="143" width="50" height="50" fill="white" stroke="#2D3748" stroke-width="2.5" rx="5"/><rect x="185" y="143" width="50" height="50" fill="white" stroke="#2D3748" stroke-width="2.5" rx="5"/><circle cx="183" cy="222" r="4" fill="#2D3748"/><line x1="90" y1="143" x2="90" y2="193" stroke="#2D3748" stroke-width="1.5"/><line x1="65" y1="168" x2="115" y2="168" stroke="#2D3748" stroke-width="1.5"/><line x1="210" y1="143" x2="210" y2="193" stroke="#2D3748" stroke-width="1.5"/><line x1="185" y1="168" x2="235" y2="168" stroke="#2D3748" stroke-width="1.5"/></svg>'},
  {e:'&#x1F680;',n:'Foguete',svg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 320"><path d="M110,15 C110,15 55,80 55,175 L165,175 C165,80 110,15 110,15Z" fill="white" stroke="#2D3748" stroke-width="3"/><circle cx="110" cy="128" r="30" fill="white" stroke="#2D3748" stroke-width="2.5"/><path d="M55,175 L18,225 L55,215 Z" fill="white" stroke="#2D3748" stroke-width="2.5"/><path d="M165,175 L202,225 L165,215 Z" fill="white" stroke="#2D3748" stroke-width="2.5"/><rect x="85" y="210" width="50" height="35" fill="white" stroke="#2D3748" stroke-width="2.5" rx="4"/><ellipse cx="95" cy="258" rx="18" ry="28" fill="white" stroke="#2D3748" stroke-width="2" opacity=".8"/><ellipse cx="125" cy="258" rx="18" ry="28" fill="white" stroke="#2D3748" stroke-width="2" opacity=".8"/></svg>'},
  {e:'&#x1F308;',n:'Arco-Iris',svg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200"><path d="M10,190 Q160,10 310,190" fill="none" stroke="#2D3748" stroke-width="30" stroke-linecap="round"/><path d="M32,190 Q160,32 288,190" fill="none" stroke="#2D3748" stroke-width="22" stroke-linecap="round"/><path d="M56,190 Q160,54 264,190" fill="none" stroke="#2D3748" stroke-width="18" stroke-linecap="round"/><path d="M80,190 Q160,74 240,190" fill="none" stroke="#2D3748" stroke-width="14" stroke-linecap="round"/><path d="M102,190 Q160,92 218,190" fill="none" stroke="#2D3748" stroke-width="11" stroke-linecap="round"/><ellipse cx="28" cy="183" rx="34" ry="21" fill="white" stroke="#2D3748" stroke-width="2.5"/><ellipse cx="50" cy="174" rx="26" ry="19" fill="white" stroke="#2D3748" stroke-width="2.5"/><ellipse cx="292" cy="183" rx="34" ry="21" fill="white" stroke="#2D3748" stroke-width="2.5"/><ellipse cx="270" cy="174" rx="26" ry="19" fill="white" stroke="#2D3748" stroke-width="2.5"/></svg>'},
  {e:'&#x1F431;',n:'Gato',svg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280"><ellipse cx="140" cy="150" rx="90" ry="80" fill="white" stroke="#2D3748" stroke-width="3"/><ellipse cx="140" cy="118" rx="55" ry="50" fill="white" stroke="#2D3748" stroke-width="3"/><polygon points="90,80 75,30 115,72" fill="white" stroke="#2D3748" stroke-width="2.5"/><polygon points="190,80 205,30 165,72" fill="white" stroke="#2D3748" stroke-width="2.5"/><circle cx="118" cy="112" r="10" fill="white" stroke="#2D3748" stroke-width="2"/><circle cx="163" cy="112" r="10" fill="white" stroke="#2D3748" stroke-width="2"/><circle cx="121" cy="115" r="4" fill="#2D3748"/><circle cx="166" cy="115" r="4" fill="#2D3748"/><ellipse cx="140" cy="130" rx="8" ry="6" fill="white" stroke="#2D3748" stroke-width="1.5"/><line x1="100" y1="130" x2="60" y2="125" stroke="#2D3748" stroke-width="1.5"/><line x1="100" y1="135" x2="58" y2="135" stroke="#2D3748" stroke-width="1.5"/><line x1="180" y1="130" x2="220" y2="125" stroke="#2D3748" stroke-width="1.5"/><line x1="180" y1="135" x2="222" y2="135" stroke="#2D3748" stroke-width="1.5"/><path d="M220,200 Q260,160 255,230" fill="none" stroke="#2D3748" stroke-width="3" stroke-linecap="round"/></svg>'},
  {e:'&#x2B50;',n:'Estrela',svg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><polygon points="150,20 185,110 280,110 205,168 232,260 150,205 68,260 95,168 20,110 115,110" fill="white" stroke="#2D3748" stroke-width="3.5"/></svg>'},
];

var corAtual='#7EC8E6', tamAtual=18, ferramenta='pincel';
var desenhando=false, ultimoPonto=null, figIdx=0;
var canvas=document.getElementById('col-canvas');
var ctx=canvas.getContext('2d');

// PALETA
var palEl=document.getElementById('paleta');
CORES.forEach(function(c){
  var b=document.createElement('button');b.className='pc';b.style.background=c;
  if(c==='#FFFFFF') b.style.border='2px solid #ccc';
  b.onclick=function(){
    corAtual=c;document.getElementById('cor-prev').style.background=c;
    document.querySelectorAll('.pc').forEach(function(x){x.classList.remove('ativo');});b.classList.add('ativo');
    setFerr('pincel',document.getElementById('f-pincel'));
  };
  if(c===corAtual) b.classList.add('ativo');
  palEl.appendChild(b);
});

// PINCÉIS
var TAMS=[6,14,24,38];
var pEl=document.getElementById('pinceis');
TAMS.forEach(function(t){
  var b=document.createElement('button');b.className='pb'+(t===tamAtual?' ativo':'');
  b.style.cssText='width:'+(t+14)+'px;height:'+(t+14)+'px;';
  var d=document.createElement('div');d.style.cssText='width:'+t+'px;height:'+t+'px;border-radius:50%;background:#7EC8E6;';
  b.appendChild(d);
  b.onclick=function(){tamAtual=t;document.querySelectorAll('.pb').forEach(function(x){x.classList.remove('ativo');});b.classList.add('ativo');};
  pEl.appendChild(b);
});

// FIGURAS
var frEl=document.getElementById('figs-row');
FIGURAS.forEach(function(f,i){
  var b=document.createElement('button');b.className='fig-btn'+(i===0?' ativo':'');b.innerHTML=f.e;b.title=f.n;
  b.onclick=function(){figIdx=i;document.querySelectorAll('.fig-btn').forEach(function(x){x.classList.remove('ativo');});b.classList.add('ativo');carregarFig(i);};
  frEl.appendChild(b);
});

function setFerr(nome,btn){ferramenta=nome;document.querySelectorAll('.fb').forEach(function(x){x.classList.remove('ativo');});btn.classList.add('ativo');}

function setupCanvas(){
  var wrap=canvas.parentElement;
  var W=Math.min(wrap.clientWidth-10,600);
  var H=Math.min(wrap.clientHeight-10,500);
  canvas.width=W;canvas.height=H;
  ctx.fillStyle='white';ctx.fillRect(0,0,W,H);
  carregarFig(figIdx);
}
function carregarFig(idx){
  var f=FIGURAS[idx];
  ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);
  var img=new Image();
  var blob=new Blob([f.svg],{type:'image/svg+xml'});
  var url=URL.createObjectURL(blob);
  img.onload=function(){
    var scale=Math.min(canvas.width/320,canvas.height/320)*.85;
    var w=320*scale,h=320*scale;
    ctx.drawImage(img,(canvas.width-w)/2,(canvas.height-h)/2,w,h);
    URL.revokeObjectURL(url);
  };
  img.src=url;
}
function getPt(e){
  var r=canvas.getBoundingClientRect();
  var sx=canvas.width/r.width,sy=canvas.height/r.height;
  if(e.touches) return{x:(e.touches[0].clientX-r.left)*sx,y:(e.touches[0].clientY-r.top)*sy};
  return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy};
}
function iniciarDesenho(e){e.preventDefault();desenhando=true;var pt=getPt(e);ultimoPonto=pt;if(ferramenta==='balde'){floodFill(Math.round(pt.x),Math.round(pt.y),hexRgb(corAtual));desenhando=false;}}
function continuarDesenho(e){if(!desenhando)return;e.preventDefault();var pt=getPt(e);var c=ferramenta==='borracha'?'white':corAtual;var t=ferramenta==='borracha'?tamAtual*2.5:tamAtual;ctx.strokeStyle=c;ctx.lineWidth=t;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(ultimoPonto.x,ultimoPonto.y);ctx.lineTo(pt.x,pt.y);ctx.stroke();ultimoPonto=pt;}
function pararDesenho(){desenhando=false;ultimoPonto=null;}
canvas.addEventListener('mousedown',iniciarDesenho);canvas.addEventListener('mousemove',continuarDesenho);canvas.addEventListener('mouseup',pararDesenho);canvas.addEventListener('mouseleave',pararDesenho);
canvas.addEventListener('touchstart',iniciarDesenho,{passive:false});canvas.addEventListener('touchmove',continuarDesenho,{passive:false});canvas.addEventListener('touchend',pararDesenho);

function hexRgb(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16),255];}
function floodFill(sx,sy,fill){
  var img=ctx.getImageData(0,0,canvas.width,canvas.height);var d=img.data;var W=canvas.width,H=canvas.height;
  var i=(sy*W+sx)*4;var tgt=[d[i],d[i+1],d[i+2],d[i+3]];
  if(tgt.every(function(v,j){return v===fill[j];})) return;
  if(tgt[0]<40&&tgt[1]<40&&tgt[2]<40) return;
  var stack=[[sx,sy]];var vis=new Uint8Array(W*H);
  while(stack.length){var px=stack.pop();var x=px[0],y=px[1];if(x<0||x>=W||y<0||y>=H) continue;var ii=(y*W+x)*4;if(vis[y*W+x]) continue;if(d[ii]<40&&d[ii+1]<40&&d[ii+2]<40) continue;var diff=Math.abs(d[ii]-tgt[0])+Math.abs(d[ii+1]-tgt[1])+Math.abs(d[ii+2]-tgt[2]);if(diff>60) continue;vis[y*W+x]=1;d[ii]=fill[0];d[ii+1]=fill[1];d[ii+2]=fill[2];d[ii+3]=255;stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}
  ctx.putImageData(img,0,0);
}
function limpar(){ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);carregarFig(figIdx);}
function salvar(){var a=document.createElement('a');a.download='meu-desenho-zupi.png';a.href=canvas.toDataURL('image/png');a.click();}
window.addEventListener('load',setupCanvas);
window.addEventListener('resize',function(){var sv=canvas.toDataURL();setupCanvas();var img=new Image();img.onload=function(){ctx.drawImage(img,0,0,canvas.width,canvas.height);};img.src=sv;});
</script>
</body>
</html>
