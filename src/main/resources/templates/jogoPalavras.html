<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forma a Palavra - Zupi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/zupi-jogos.css">
  <style>
    .pic{font-size:5.5rem;display:block;animation:emojiBounce 2s ease-in-out infinite alternate;filter:drop-shadow(0 6px 12px rgba(126,200,230,.3));}
    .cat{font-size:.72rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7EC8E6;margin:.3rem 0;font-family:'Poppins',sans-serif;}
    .slots{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;min-height:62px;align-items:center;margin:.6rem 0;}
    .slot{width:50px;height:54px;border:2.5px dashed rgba(126,200,230,.4);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;cursor:pointer;transition:all .2s;background:rgba(126,200,230,.05);font-family:'Poppins',sans-serif;}
    .slot.on{border-style:solid;border-color:#7EC8E6;background:rgba(126,200,230,.12);animation:slotIn .25s cubic-bezier(.34,1.56,.64,1);}
    @keyframes slotIn{from{transform:scale(.7)}to{transform:scale(1)}}
    .slot.ok{border-color:#A8D5BA!important;background:rgba(168,213,186,.18)!important;box-shadow:0 0 12px rgba(168,213,186,.45)!important;}
    .slot.no{animation:zjShake .4s ease;}
    .letras{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:.6rem 0;max-width:420px;}
    .lbtn{width:50px;height:50px;border-radius:12px;border:none;font-family:'Poppins',sans-serif;font-size:1.4rem;font-weight:800;cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);color:#2D3748;}
    .lbtn:hover{transform:scale(1.12) translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.15);}
    .lbtn:active{transform:scale(.9);}
    .lbtn.used{opacity:.18;pointer-events:none;transform:scale(.85);}
    .ctrls{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin:.4rem 0;}
    .cbtn{padding:.5rem 1.2rem;border-radius:50px;font-family:'Poppins',sans-serif;font-weight:700;font-size:.85rem;border:none;cursor:pointer;transition:all .25s;}
    .cbtn-del{background:rgba(249,198,208,.25);color:#F9C6D0;border:2px solid #F9C6D0;}
    .cbtn-del:hover{background:#F9C6D0;color:#2D3748;}
    .cbtn-ok{background:linear-gradient(135deg,#A8D5BA,#7EC8E6);color:white;box-shadow:0 4px 12px rgba(126,200,230,.35);}
    .cbtn-ok:hover{transform:scale(1.05);}
    .cbtn-dic{background:rgba(255,230,109,.2);color:#FFE66D;border:2px solid #FFE66D;}
    .cbtn-dic:hover{background:#FFE66D;color:#2D3748;}
    .streak-dots{display:flex;gap:5px;justify-content:center;margin:.4rem 0;}
    .sdot{width:12px;height:12px;border-radius:50%;background:rgba(126,200,230,.2);transition:all .3s;}
    .sdot.on{background:#FFE66D;box-shadow:0 0 8px #FFE66D;}
  </style>
</head>
<body class="zj-body">
<div id="zj-sky" class="zj-sky"></div>
<nav class="zj-nav">
  <a href="/menuJogos" class="zj-brand">&#x1F43E; Zupi</a>
  <div class="zj-stats">
    <div class="zj-pill">&#x2B50; <span id="p">0</span></div>
    <div class="zj-pill">&#x1F4DD; <span id="q">1/10</span></div>
    <div class="zj-pill">&#x1F4A1; <span id="d">3</span></div>
  </div>
</nav>
<div class="zj-main">
  <div class="zj-card" id="jcard" style="display:none;text-align:center">
    <div class="zj-prog"><div class="zj-prog-fill" id="pf" style="width:0%"></div></div>
    <div class="streak-dots" id="sdots"></div>
    <span class="pic" id="pic">&#x1F436;</span>
    <div class="cat" id="cat">Animal</div>
    <div class="slots" id="slots"></div>
    <div class="letras" id="letras"></div>
    <div class="ctrls">
      <button class="cbtn cbtn-del" onclick="apagar()">&#x2B05; Apagar</button>
      <button class="cbtn cbtn-ok" onclick="verificar()">&#x2705; Verificar!</button>
      <button class="cbtn cbtn-dic" onclick="dica()">&#x1F4A1; Dica</button>
    </div>
  </div>
</div>

<div class="zj-overlay" id="oi">
  <div class="zj-modal">
    <span class="zj-modal-emoji">&#x1F4DD;</span>
    <div class="zj-modal-title">Forma a Palavra!</div>
    <div class="zj-modal-sub">Veja o emoji, clique nas letras e forme a palavra correta!</div>
    <button class="zj-btn zj-btn-main" onclick="iniciar()">&#x1F680; Comecar!</button><br>
    <a href="/menuJogos" class="zj-btn zj-btn-ghost" style="margin-top:.5rem">&#x2B05; Menu</a>
  </div>
</div>
<div class="zj-overlay" id="of" style="display:none">
  <div class="zj-modal">
    <span class="zj-modal-emoji">&#x1F3C6;</span>
    <div class="zj-modal-title">Fim do Jogo!</div>
    <div class="zj-modal-sub" id="fs"></div>
    <button class="zj-btn zj-btn-main" onclick="reiniciar()">&#x1F504; Jogar novamente</button><br>
    <a href="/menuJogos" class="zj-btn zj-btn-ghost" style="margin-top:.5rem">&#x2B05; Menu</a>
  </div>
</div>

<script src="/js/zupi-sky.js"></script>
<script th:inline="none">
zupiSky();
var PALAVRAS=[
  {e:'&#x1F436;',p:'CACHORRO',c:'Animal',h:'Late e abana o rabo'},
  {e:'&#x1F431;',p:'GATO',c:'Animal',h:'Mia e ronrona'},
  {e:'&#x1F418;',p:'ELEFANTE',c:'Animal',h:'Tem tromba longa'},
  {e:'&#x1F981;',p:'LEAO',c:'Animal',h:'Rei da selva'},
  {e:'&#x1F34E;',p:'MACA',c:'Fruta',h:'Vermelha e redonda'},
  {e:'&#x1F34C;',p:'BANANA',c:'Fruta',h:'Amarela e curva'},
  {e:'&#x1F353;',p:'MORANGO',c:'Fruta',h:'Vermelho e doce'},
  {e:'&#x1F680;',p:'FOGUETE',c:'Objeto',h:'Vai para o espaco'},
  {e:'&#x2B50;',p:'ESTRELA',c:'Natureza',h:'Brilha no ceu'},
  {e:'&#x1F308;',p:'ARCOIRIS',c:'Natureza',h:'Surge apos a chuva'},
  {e:'&#x1F98B;',p:'BORBOLETA',c:'Animal',h:'Tem asas coloridas'},
  {e:'&#x1F33A;',p:'FLOR',c:'Natureza',h:'Linda e cheirosa'}
];
var LCORES=['#7EC8E6','#A8D5BA','#FFE66D','#FFB980','#F9C6D0','#C8B8F0'];
var pts=0,dicas=3,q=0,total=10,pa,letrasEmb,resp=[],usadas=[],lista=[];
function shuffle(a){return a.sort(function(){return Math.random()-.5;});}
function iniciar(){
  document.getElementById('oi').style.display='none';
  document.getElementById('jcard').style.display='';
  lista=shuffle(PALAVRAS.slice()).slice(0,total);
  pts=0;dicas=3;q=0;
  construirDots(); carregarP();
}
function construirDots(){
  var d=document.getElementById('sdots');d.innerHTML='';
  for(var i=0;i<total;i++){var s=document.createElement('div');s.className='sdot';s.id='dot'+i;d.appendChild(s);}
}
function carregarP(){
  resp=[]; usadas=[];
  pa=lista[q];
  document.getElementById('pic').innerHTML=pa.e;
  document.getElementById('cat').textContent=pa.c;
  document.getElementById('q').textContent=(q+1)+'/'+total;
  document.getElementById('d').textContent=dicas;
  document.getElementById('pf').style.width=(q/total*100)+'%';
  var letras=pa.p.split('');
  var extras='ABCDEFGHIJKLMNOPRSTUVZ'.split('');
  var qe=Math.min(3,8-letras.length);
  for(var i=0;i<qe;i++) letras.push(extras[Math.floor(Math.random()*extras.length)]);
  letrasEmb=shuffle(letras.slice());
  renderSlots(); renderLetras();
}
function renderSlots(){
  var c=document.getElementById('slots');c.innerHTML='';
  for(var i=0;i<pa.p.length;i++){
    var s=document.createElement('div');s.className='slot';s.id='slot'+i;
    s.onclick=(function(idx){return function(){remover(idx);};})(i);
    c.appendChild(s);
  }
}
function renderLetras(){
  var c=document.getElementById('letras');c.innerHTML='';
  letrasEmb.forEach(function(l,i){
    var b=document.createElement('button');b.className='lbtn';b.id='l'+i;b.textContent=l;
    b.style.background=LCORES[i%LCORES.length];
    b.onclick=(function(idx,letra){return function(){clicarLetra(idx,letra);};})(i,l);
    c.appendChild(b);
  });
}
function clicarLetra(i,l){
  if(usadas.indexOf(i)>=0||resp.length>=pa.p.length) return;
  usadas.push(i); document.getElementById('l'+i).classList.add('used');
  resp.push({l:l,i:i});
  var slot=document.getElementById('slot'+(resp.length-1));
  slot.textContent=l; slot.classList.add('on');
  if(resp.length===pa.p.length) setTimeout(verificar,350);
}
function remover(){
  if(resp.length===0) return;
  var u=resp.pop();
  var slot=document.getElementById('slot'+resp.length);
  slot.textContent=''; slot.classList.remove('on','ok','no');
  usadas=usadas.filter(function(x){return x!==u.i;});
  document.getElementById('l'+u.i).classList.remove('used');
}
function verificar(){
  var tent=resp.map(function(x){return x.l;}).join('');
  if(tent===pa.p){
    for(var i=0;i<pa.p.length;i++) document.getElementById('slot'+i).classList.add('ok');
    zupiRight(); pts+=100+dicas*10; document.getElementById('p').textContent=pts;
    document.getElementById('dot'+q).classList.add('on');
    zupiConfete(20);
    q++;
    if(q>=total) setTimeout(fimDeJogo,900);
    else setTimeout(carregarP,1000);
  } else {
    zupiWrong();
    resp.forEach(function(r,i){
      if(r.l!==pa.p[i]) document.getElementById('slot'+i).classList.add('no');
    });
    setTimeout(function(){
      for(var i=0;i<pa.p.length;i++){var s=document.getElementById('slot'+i);s.textContent='';s.classList.remove('on','ok','no');}
      usadas.forEach(function(i){document.getElementById('l'+i).classList.remove('used');});
      resp=[]; usadas=[];
    },850);
  }
}
function dica(){
  if(dicas<=0) return;
  for(var i=0;i<pa.p.length;i++){
    var slot=document.getElementById('slot'+i);
    if(!slot.textContent){
      var lCorreta=pa.p[i];
      for(var j=0;j<letrasEmb.length;j++){
        if(letrasEmb[j]===lCorreta&&usadas.indexOf(j)<0){clicarLetra(j,lCorreta);dicas--;document.getElementById('d').textContent=dicas;return;}
      }
      break;
    }
  }
}
function apagar(){remover();}
function fimDeJogo(){
  document.getElementById('fs').textContent='Pontuacao: '+pts+' pontos! Todas as '+total+' palavras!';
  document.getElementById('of').style.display='flex';
  zupiConfete(40);
}
function reiniciar(){document.getElementById('of').style.display='none';iniciar();}
</script>
</body>
</html>
