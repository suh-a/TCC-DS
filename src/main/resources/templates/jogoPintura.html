<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mistura de Cores - Zupi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/zupi-jogos.css">
  <style>
    .mres{width:100px;height:100px;border-radius:50%;margin:.6rem auto;border:3px solid rgba(126,200,230,.3);transition:background .5s cubic-bezier(.34,1.56,.64,1);box-shadow:0 6px 22px rgba(0,0,0,.1);animation:emojiBounce 2.5s ease-in-out infinite alternate;}
    .mresn{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.1rem;min-height:1.5rem;transition:color .4s;margin-bottom:.4rem;}
    .mperg{font-size:.95rem;color:#6B7280;font-family:'Poppins',sans-serif;margin-bottom:.8rem;}
    .msels{display:flex;justify-content:center;gap:.5rem;align-items:center;min-height:56px;margin:.5rem 0;}
    .msel{width:50px;height:50px;border-radius:50%;border:3px solid rgba(126,200,230,.3);box-shadow:0 3px 10px rgba(0,0,0,.1);transition:background .3s;animation:zjPop .3s cubic-bezier(.34,1.56,.64,1);}
    .mop{font-size:1.4rem;font-weight:800;color:#A8D5BA;}
    .mig{font-size:1.4rem;font-weight:800;color:#FFB980;}
    .mbaldes{display:flex;justify-content:center;gap:.7rem;flex-wrap:wrap;margin:.8rem 0;}
    .mbalde{width:76px;height:84px;border-radius:14px 14px 18px 18px;cursor:pointer;position:relative;border:3px solid rgba(255,255,255,.45);transition:all .3s cubic-bezier(.34,1.56,.64,1);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:.4rem;box-shadow:0 5px 16px rgba(0,0,0,.1);}
    .mbalde::before{content:'🪣';font-size:2rem;position:absolute;top:-16px;left:50%;transform:translateX(-50%);}
    .mbalde:hover{transform:scale(1.1) translateY(-5px);box-shadow:0 10px 26px rgba(0,0,0,.16);}
    .mbalde:active{transform:scale(.93);}
    .mbalde.sel{outline:3px solid rgba(255,255,255,.75);transform:scale(1.12) translateY(-7px);}
    .mbn{font-size:.7rem;font-weight:700;color:white;text-shadow:0 1px 3px rgba(0,0,0,.4);font-family:'Poppins',sans-serif;}
  </style>
</head>
<body class="zj-body">
<div id="zj-sky" class="zj-sky"></div>
<nav class="zj-nav">
  <a href="/menuJogos" class="zj-brand">&#x1F43E; Zupi</a>
  <div class="zj-stats">
    <div class="zj-pill">&#x2B50; <span id="p">0</span></div>
    <div class="zj-pill">&#x1F58C;&#xFE0F; <span id="q">1/12</span></div>
    <div class="zj-pill">&#x1F525; <span id="st">0</span></div>
  </div>
</nav>
<div class="zj-main">
  <div class="zj-card" id="jcard" style="display:none">
    <div class="zj-prog"><div class="zj-prog-fill" id="pf" style="width:0%"></div></div>
    <div style="font-size:.7rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#7EC8E6;margin-bottom:.35rem;font-family:'Poppins',sans-serif">Resultado da mistura</div>
    <div class="mres" id="mres" style="background:#e0e0e0"></div>
    <div class="mresn" id="mresn">?</div>
    <div class="mperg" id="mperg">Quais 2 cores formam essa cor?</div>
    <div class="msels" id="msels">
      <div class="msel" id="ms1" style="background:#e0e0e0"></div>
      <div class="mop">+</div>
      <div class="msel" id="ms2" style="background:#e0e0e0"></div>
      <div class="mig">=</div>
      <div class="msel" id="msp" style="background:#e0e0e0"></div>
    </div>
    <div class="mbaldes" id="mbaldes"></div>
  </div>
</div>
<div class="zj-overlay" id="oi">
  <div class="zj-modal">
    <span class="zj-modal-emoji">&#x1F58C;&#xFE0F;</span>
    <div class="zj-modal-title">Mistura de Cores!</div>
    <div class="zj-modal-sub">Veja a cor resultado e descubra quais 2 cores foram misturadas! Magia das cores!</div>
    <button class="zj-btn zj-btn-main" onclick="iniciar()">&#x1F680; Jogar!</button><br>
    <a href="/menuJogos" class="zj-btn zj-btn-ghost" style="margin-top:.5rem">&#x2B05; Menu</a>
  </div>
</div>
<div class="zj-overlay" id="of" style="display:none">
  <div class="zj-modal">
    <span class="zj-modal-emoji" id="fe">&#x1F3C6;</span>
    <div class="zj-modal-title" id="ft">Fim!</div>
    <div class="zj-modal-sub" id="fs"></div>
    <button class="zj-btn zj-btn-main" onclick="reiniciar()">&#x1F504; Jogar novamente</button><br>
    <a href="/menuJogos" class="zj-btn zj-btn-ghost" style="margin-top:.5rem">&#x2B05; Menu</a>
  </div>
</div>
<script src="/js/zupi-sky.js"></script>
<script th:inline="none">
zupiSky();
var MIX=[
  {c1:{n:'Azul',h:'#4D96FF'},c2:{n:'Amarelo',h:'#FFE66D'},r:{n:'Verde',h:'#A8D5BA'}},
  {c1:{n:'Vermelho',h:'#FF6B6B'},c2:{n:'Azul',h:'#4D96FF'},r:{n:'Roxo',h:'#C8B8F0'}},
  {c1:{n:'Vermelho',h:'#FF6B6B'},c2:{n:'Amarelo',h:'#FFE66D'},r:{n:'Laranja',h:'#FFB980'}},
  {c1:{n:'Vermelho',h:'#FF6B6B'},c2:{n:'Branco',h:'#F5F5F5'},r:{n:'Rosa',h:'#F9C6D0'}},
  {c1:{n:'Azul',h:'#7EC8E6'},c2:{n:'Branco',h:'#F5F5F5'},r:{n:'Azul Claro',h:'#C9EAF8'}},
  {c1:{n:'Verde',h:'#A8D5BA'},c2:{n:'Azul',h:'#7EC8E6'},r:{n:'Turquesa',h:'#7EC8D8'}},
  {c1:{n:'Roxo',h:'#C8B8F0'},c2:{n:'Rosa',h:'#F9C6D0'},r:{n:'Lavanda',h:'#DDD0F8'}},
  {c1:{n:'Laranja',h:'#FFB980'},c2:{n:'Vermelho',h:'#FF6B6B'},r:{n:'Coral',h:'#FF8C79'}},
  {c1:{n:'Amarelo',h:'#FFE66D'},c2:{n:'Verde',h:'#A8D5BA'},r:{n:'Verde Limao',h:'#CFEC8A'}},
  {c1:{n:'Rosa',h:'#F9C6D0'},c2:{n:'Laranja',h:'#FFB980'},r:{n:'Salmon',h:'#FFA8A8'}},
  {c1:{n:'Azul',h:'#7EC8E6'},c2:{n:'Verde',h:'#A8D5BA'},r:{n:'Aguamarina',h:'#8DCECC'}},
  {c1:{n:'Amarelo',h:'#FFE66D'},c2:{n:'Branco',h:'#F5F5F5'},r:{n:'Creme',h:'#FFFDD0'}}
];
var BASE=[{n:'Vermelho',h:'#FF6B6B'},{n:'Azul',h:'#7EC8E6'},{n:'Amarelo',h:'#FFE66D'},{n:'Verde',h:'#A8D5BA'},{n:'Roxo',h:'#C8B8F0'},{n:'Laranja',h:'#FFB980'},{n:'Rosa',h:'#F9C6D0'},{n:'Branco',h:'#F5F5F5'}];
var pts=0,streak=0,q=0,total=12,resp=false,ma,sel=[],lista=[];
function shuffle(a){return a.sort(function(){return Math.random()-.5;});}
function iniciar(){
  document.getElementById('oi').style.display='none';document.getElementById('jcard').style.display='';
  pts=0;streak=0;q=0;lista=shuffle(MIX.slice()).slice(0,total);gerarQ();
}
function gerarQ(){
  resp=false;sel=[];ma=lista[q%lista.length];
  document.getElementById('mres').style.background=ma.r.h;
  document.getElementById('mresn').textContent=ma.r.n;document.getElementById('mresn').style.color=ma.r.h;
  document.getElementById('mperg').textContent='Clique nas 2 cores que formam '+ma.r.n+'!';
  document.getElementById('ms1').style.background='#e0e0e0';
  document.getElementById('ms2').style.background='#e0e0e0';
  document.getElementById('msp').style.background='#e0e0e0';
  q++;document.getElementById('q').textContent=q+'/'+total;
  document.getElementById('pf').style.width=((q-1)/total*100)+'%';
  var usadas=new Set([ma.c1.n,ma.c2.n]);
  var extras=shuffle(BASE.filter(function(c){return !usadas.has(c.n);})).slice(0,2);
  var opcoes=shuffle([ma.c1,ma.c2].concat(extras));
  var baldes=document.getElementById('mbaldes');baldes.innerHTML='';
  opcoes.forEach(function(c){
    var b=document.createElement('button');b.className='mbalde';
    b.style.background='linear-gradient(180deg,'+c.h+'cc,'+c.h+')';
    b.innerHTML='<span class="mbn">'+c.n+'</span>';
    b.onclick=function(){selecionarCor(b,c);};
    baldes.appendChild(b);
  });
}
function selecionarCor(btn,c){
  if(resp) return;
  var idx=sel.findIndex(function(s){return s.n===c.n;});
  if(idx>=0){sel.splice(idx,1);btn.classList.remove('sel');}
  else if(sel.length<2){sel.push(c);btn.classList.add('sel');zupiTone(440,'sine',.1);}
  if(sel.length>=1) document.getElementById('ms1').style.background=sel[0].h; else document.getElementById('ms1').style.background='#e0e0e0';
  if(sel.length>=2){document.getElementById('ms2').style.background=sel[1].h;document.getElementById('msp').style.background=ma.r.h+'88';setTimeout(verificar,400);}
  else{document.getElementById('ms2').style.background='#e0e0e0';document.getElementById('msp').style.background='#e0e0e0';}
}
function verificar(){
  resp=true;
  var nomes=new Set(sel.map(function(s){return s.n;}));
  var ok=nomes.has(ma.c1.n)&&nomes.has(ma.c2.n);
  if(ok){
    zupiRight();streak++;var bonus=streak>=3?streak*3:0;pts+=15+bonus;
    document.getElementById('p').textContent=pts;document.getElementById('st').textContent=streak;
    document.getElementById('msp').style.background=ma.r.h;
    zupiConfete(20);
    if(q>=total) setTimeout(fimDeJogo,900);
    else setTimeout(gerarQ,1100);
  } else {
    zupiWrong();streak=0;document.getElementById('st').textContent=0;
    document.getElementById('msp').style.background='#FF6B6B44';
    document.querySelectorAll('.mbalde').forEach(function(b){b.classList.remove('sel');});
    setTimeout(function(){sel=[];resp=false;document.getElementById('ms1').style.background='#e0e0e0';document.getElementById('ms2').style.background='#e0e0e0';document.getElementById('msp').style.background='#e0e0e0';},850);
  }
}
function fimDeJogo(){
  document.getElementById('fe').innerHTML=pts>=150?'&#x1F3C6;':pts>=80?'&#x2B50;':'&#x1F58C;&#xFE0F;';
  document.getElementById('ft').textContent=pts>=150?'Artista das Cores!!':pts>=80?'Muito bom!':'Continue praticando!';
  document.getElementById('fs').textContent=pts+' pontos! Aprendeu '+total+' misturas de cores!';
  document.getElementById('of').style.display='flex';
}
function reiniciar(){document.getElementById('of').style.display='none';iniciar();}
</script>
</body>
</html>
