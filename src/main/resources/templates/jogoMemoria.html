<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jogo da Memoria - Zupi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/zupi-jogos.css">
  <style>
    .mb{display:grid;gap:9px;justify-content:center;padding:.75rem;}
    .mc{cursor:pointer;perspective:700px;width:90px;height:90px;}
    .mc:hover:not(.fl):not(.ok){transform:scale(1.07) translateY(-4px);}
    .mi{width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);position:relative;}
    .mc.fl .mi,.mc.ok .mi{transform:rotateY(180deg);}
    .mf,.mv{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;}
    .mv{background:linear-gradient(135deg,#7EC8E6,#A8D5BA);border:2px solid rgba(126,200,230,.4);box-shadow:0 4px 14px rgba(126,200,230,.25);font-size:1.6rem;color:rgba(255,255,255,.5);}
    .mv::after{content:'?';font-weight:900;color:rgba(255,255,255,.55);}
    .mf{transform:rotateY(180deg);background:white;border:2px solid rgba(126,200,230,.2);overflow:hidden;}
    .mf img{width:100%;height:100%;object-fit:cover;border-radius:12px;}
    .mc.ok .mf{border-color:#A8D5BA;box-shadow:0 0 20px rgba(168,213,186,.6);}
    .mc.ok{animation:mcOk .4s cubic-bezier(.34,1.56,.64,1);}
    @keyframes mcOk{0%{transform:scale(1)}50%{transform:scale(1.13)}100%{transform:scale(1)}}
    .hud-extra{position:fixed;top:0;left:0;right:0;height:58px;z-index:500;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);border-bottom:2px solid rgba(126,200,230,.2);display:flex;justify-content:space-around;align-items:center;box-shadow:0 2px 14px rgba(126,200,230,.14);}
    .hstat{text-align:center;}
    .hsl{font-size:.6rem;opacity:.6;text-transform:uppercase;letter-spacing:1px;font-family:'Poppins',sans-serif;}
    .hsv{font-size:1.3rem;font-weight:800;font-family:'Poppins',sans-serif;line-height:1;}
    .oculto{display:none!important;}
    .tela{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1rem;padding:70px 1rem 1rem;position:relative;z-index:1;}
    .big-e{font-size:5.5rem;display:block;animation:emojiBounce 1.2s ease-in-out infinite alternate;}
  </style>
</head>
<body class="zj-body">
<div id="zj-sky" class="zj-sky"></div>
<div class="hud-extra" id="hud">
  <div class="hstat"><div class="hsl">Fase</div><div class="hsv" id="hf" style="color:#7EC8E6">-</div></div>
  <div class="hstat"><div class="hsl">Tempo</div><div class="hsv" id="ht" style="color:#FFB980">-</div></div>
  <div class="hstat"><div class="hsl">Pares</div><div class="hsv" id="hp" style="color:#A8D5BA">-</div></div>
</div>

<div class="tela" id="ti">
  <span class="big-e">&#x1F43E;</span>
  <h1 class="zj-title">Jogo da Memoria!</h1>
  <p style="color:#6B7280;max-width:300px;text-align:center;font-size:.95rem;font-family:'Poppins',sans-serif">Encontre os pares de animais! 5 fases cada vez mais desafiadoras!</p>
  <button class="zj-btn zj-btn-main" onclick="iniciar()">&#x1F680; Comecar!</button>
  <a href="/menuJogos" class="zj-btn zj-btn-ghost">&#x2B05; Menu</a>
</div>

<div class="tela oculto" id="tj" style="padding-top:64px;justify-content:flex-start">
  <div class="mb" id="board"></div>
</div>

<div class="tela oculto" id="tv" style="gap:1rem">
  <span class="big-e" id="ve">&#x1F389;</span>
  <h2 class="zj-title" id="vt">Fase Completa!</h2>
  <p style="color:#6B7280;text-align:center;font-family:'Poppins',sans-serif" id="vs"></p>
  <button class="zj-btn zj-btn-main" id="bcont" onclick="proximaFase()">&#x27A1; Proxima Fase!</button>
  <button class="zj-btn zj-btn-ghost" onclick="reiniciar()">&#x1F504; Recomecar</button>
</div>

<script src="/js/zupi-sky.js"></script>
<script th:inline="none">
zupiSky();
var FASES=[{p:2,t:45,cols:2},{p:4,t:60,cols:4},{p:6,t:75,cols:4},{p:8,t:90,cols:4},{p:10,t:110,cols:5}];
var ANIMAIS=['cachorro','gato','elefante','leao','panda','pato','pinguin','raposa','tucano','zebra','girafa','lobo','macaco','flamingo','coelho'];
var fase=0,pares=0,bloq=false,prim=null,tempo=0,tmInt;

function shuffle(a){return a.sort(function(){return Math.random()-.5;});}

function iniciar(){
  document.getElementById('ti').classList.add('oculto');
  document.getElementById('tv').classList.add('oculto');
  document.getElementById('tj').classList.remove('oculto');
  carregarFase();
}
function carregarFase(){
  pares=0;bloq=false;prim=null;
  var f=FASES[fase];
  document.getElementById('hf').textContent=fase+1;
  document.getElementById('hp').textContent='0/'+f.p;
  var imgs=shuffle(ANIMAIS.slice()).slice(0,f.p);
  var prs=shuffle(imgs.concat(imgs));
  var board=document.getElementById('board');
  board.style.gridTemplateColumns='repeat('+f.cols+',90px)';
  board.innerHTML='';
  prs.forEach(function(nome){
    var c=document.createElement('div'); c.className='mc';
    c.innerHTML='<div class="mi"><div class="mv"></div><div class="mf"><img src="/img/'+nome+'.jpg" alt="'+nome+'" loading="lazy"></div></div>';
    c.addEventListener('click',function(){virar(c,nome);});
    board.appendChild(c);
  });
  tempo=f.t; atuHud(); clearInterval(tmInt);
  tmInt=setInterval(function(){
    tempo--;atuHud();
    if(tempo<=10) document.getElementById('ht').style.color='#FFB980';
    if(tempo<=0){clearInterval(tmInt);gameOver();}
  },1000);
}
function atuHud(){document.getElementById('ht').textContent=tempo+'s';}
function virar(card,nome){
  if(bloq||card.classList.contains('fl')||card.classList.contains('ok')) return;
  card.classList.add('fl'); zupiTone(440,'sine',.1);
  if(!prim){prim={card:card,nome:nome};return;}
  bloq=true;
  var seg={card:card,nome:nome};
  if(nome===prim.nome){
    zupiRight(); pares++;
    document.getElementById('hp').textContent=pares+'/'+FASES[fase].p;
    var r1=prim.card.getBoundingClientRect(),r2=card.getBoundingClientRect();
    zupiStars(r1.left+45,r1.top+45); zupiStars(r2.left+45,r2.top+45);
    setTimeout(function(){
      prim.card.classList.add('ok'); seg.card.classList.add('ok');
      prim=null; bloq=false;
      if(pares===FASES[fase].p) setTimeout(venceu,500);
    },200);
  } else {
    zupiWrong();
    setTimeout(function(){prim.card.classList.remove('fl');seg.card.classList.remove('fl');prim=null;bloq=false;},880);
  }
}
function venceu(){
  clearInterval(tmInt); zupiLevelUp(); zupiConfete(40);
  document.getElementById('tj').classList.add('oculto');
  document.getElementById('tv').classList.remove('oculto');
  var msgs=[{e:'&#x1F389;',t:'Fase 1 Completa!'},{e:'&#x2B50;',t:'Fase 2 Concluida!'},{e:'&#x1F31F;',t:'Fase 3 Arrasou!'},{e:'&#x1F3C6;',t:'Fase 4 Epica!'},{e:'&#x1F451;',t:'CAMPEA DA MEMORIA!'}];
  document.getElementById('ve').innerHTML=msgs[fase].e;
  document.getElementById('vt').textContent=msgs[fase].t;
  document.getElementById('vs').textContent=fase<4?'Continue para a fase '+(fase+2)+'!':'Voce completou todas as 5 fases!';
  document.getElementById('bcont').style.display=fase<4?'':'none';
}
function gameOver(){
  document.getElementById('tj').classList.add('oculto');
  document.getElementById('tv').classList.remove('oculto');
  document.getElementById('ve').innerHTML='&#x23F0;';
  document.getElementById('vt').textContent='Tempo esgotado!';
  document.getElementById('vs').textContent='Tente novamente!';
  document.getElementById('bcont').style.display='none';
}
function proximaFase(){if(fase<4){fase++;document.getElementById('tv').classList.add('oculto');document.getElementById('tj').classList.remove('oculto');carregarFase();}}
function reiniciar(){fase=0;document.getElementById('tv').classList.add('oculto');document.getElementById('ti').classList.remove('oculto');}
</script>
</body>
</html>
