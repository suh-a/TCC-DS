<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastrar — Zupi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="icon" href="../assets/img/favicon.png" type="image/png">
</head>
<body class="auth-page">
  <div class="background-decor" aria-hidden="true"></div>

  <nav class="navbar navbar-expand-lg navbar-light bg-white" role="navigation">
    <div class="container">
      <a class="navbar-brand" id="brand-color-2" href="/">Zupi</a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/login">Entrar</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="d-flex align-items-center justify-content-center py-5" style="min-height: calc(100vh - 160px);">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-7">
          <div class="auth-card p-4">

            <!-- Passo 1: escolher tipo -->
            <div id="stepTipo">
              <h1 class="text-center h3 mb-4">Como você vai usar o Zupi?</h1>
              <div class="row g-3">
                <div class="col-md-6">
                  <button type="button" class="btn btn-outline-primary w-100 py-4 tipo-btn" data-tipo="PESSOA_FISICA">
                    <strong>Pessoa Física</strong><br>
                    <small class="text-muted">Sou responsável por uma criança</small>
                  </button>
                </div>
                <div class="col-md-6">
                  <button type="button" class="btn btn-outline-primary w-100 py-4 tipo-btn" data-tipo="PESSOA_JURIDICA">
                    <strong>Pessoa Jurídica</strong><br>
                    <small class="text-muted">Represento uma escola</small>
                  </button>
                </div>
              </div>
            </div>

            <!-- Passo 2: Pessoa Física -->
            <div id="formPF" class="d-none">
              <button type="button" class="btn btn-link ps-0 mb-2 voltar-tipo">← Voltar</button>
              <h1 class="h3 mb-4">Cadastro — Pessoa Física</h1>
              <form id="signupFormPF" novalidate>
                <div class="mb-3">
                  <label for="nomePF" class="form-label">Nome completo</label>
                  <input type="text" class="form-control" id="nomePF" required>
                </div>
                <div class="mb-3">
                  <label for="emailPF" class="form-label">E-mail</label>
                  <input type="email" class="form-control" id="emailPF" required>
                </div>
                <div class="mb-3">
                  <label for="cpfPF" class="form-label">CPF</label>
                  <input type="text" class="form-control" id="cpfPF" placeholder="000.000.000-00" maxlength="14" required>
                </div>
                <div class="mb-3">
                  <label for="nascimentoPF" class="form-label">Data de nascimento</label>
                  <input type="date" class="form-control" id="nascimentoPF" required>
                </div>
                <div class="mb-3">
                  <label for="senhaPF" class="form-label">Senha</label>
                  <input type="password" class="form-control" id="senhaPF" required minlength="6">
                </div>
                <div class="mb-3">
                  <label for="senhaConfirmPF" class="form-label">Confirmar senha</label>
                  <input type="password" class="form-control" id="senhaConfirmPF" required>
                </div>
                <p id="erroPF" class="text-danger small" style="display:none;"></p>
                <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
              </form>
            </div>

            <!-- Passo 2: Pessoa Jurídica -->
            <div id="formPJ" class="d-none">
              <button type="button" class="btn btn-link ps-0 mb-2 voltar-tipo">← Voltar</button>
              <h1 class="h3 mb-4">Cadastro — Pessoa Jurídica</h1>
              <form id="signupFormPJ" novalidate>
                <div class="mb-3">
                  <label for="nomePJ" class="form-label">Nome da empresa / escola</label>
                  <input type="text" class="form-control" id="nomePJ" required>
                </div>
                <div class="mb-3">
                  <label for="emailPJ" class="form-label">E-mail</label>
                  <input type="email" class="form-control" id="emailPJ" required>
                </div>
                <div class="mb-3">
                  <label for="cnpjPJ" class="form-label">CNPJ</label>
                  <input type="text" class="form-control" id="cnpjPJ" placeholder="00.000.000/0000-00" maxlength="18" required>
                </div>
                <div class="mb-3">
                  <label for="senhaPJ" class="form-label">Senha</label>
                  <input type="password" class="form-control" id="senhaPJ" required minlength="6">
                </div>
                <div class="mb-3">
                  <label for="senhaConfirmPJ" class="form-label">Confirmar senha</label>
                  <input type="password" class="form-control" id="senhaConfirmPJ" required>
                </div>
                <p id="erroPJ" class="text-danger small" style="display:none;"></p>
                <button type="submit" class="btn btn-primary w-100">Cadastrar escola</button>
              </form>
            </div>

            <p class="text-center mt-4 mb-0">
              Já tem conta? <a href="/login">Entre aqui</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="/js/cadastroScript.js"></script>
</body>
</html>
