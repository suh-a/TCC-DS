<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atividades Interativas — Zupi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/dark-mode.css" />
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <main class="container py-5">
    <h1 class="text-zupi-primary mb-4">Atividades Interativas</h1>
    <p class="text-muted mb-4">Atividades educativas personalizadas com base no perfil da criança.</p>
    <div id="atividadesList" class="row g-4"></div>
    <button id="btnPdf" class="btn btn-outline-primary mt-4" type="button">Baixar atividades em PDF</button>
  </main>
  <script src="/js/page-nav.js"></script>
  <script src="/js/content-pages.js"></script>
  <script src="/js/theme.js"></script>
  <script>
    ContentPages.loadAtividades();
    document.getElementById('btnPdf').addEventListener('click', () => ContentPages.downloadPdf('atividades'));
  </script>
</body>
</html>
