<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Esqueci minha senha — Zupi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="auth-page">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="auth-card p-4">
          <h1 class="h4 mb-3">Recuperar senha</h1>
          <p class="text-muted small">Enviaremos um link para redefinir sua senha.</p>
          <form id="formEsqueci">
            <div class="mb-3">
              <label for="email" class="form-label">E-mail cadastrado</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Enviar link</button>
            <p id="msg" class="mt-3 small"></p>
          </form>
          <p class="mt-3 mb-0 text-center"><a href="/login">Voltar ao login</a></p>
        </div>
      </div>
    </div>
  </main>
  <script>
    document.getElementById('formEsqueci').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const email = document.getElementById('email').value;
      try {
        const res = await fetch('/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        msg.className = 'mt-3 small text-success';
        msg.textContent = res.ok || res.status === 202
          ? 'Se o e-mail existir, você receberá as instruções (verifique também o console do servidor em ambiente de teste).'
          : 'Não foi possível processar. Tente novamente.';
      } catch {
        msg.className = 'mt-3 small text-danger';
        msg.textContent = 'Erro de conexão.';
      }
    });
  </script>
</body>
</html>
