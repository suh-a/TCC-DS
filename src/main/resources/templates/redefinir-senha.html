<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redefinir senha — Zupi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="auth-page">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="auth-card p-4">
          <h1 class="h4 mb-3">Nova senha</h1>
          <form id="formReset">
            <div class="mb-3">
              <label for="senha" class="form-label">Nova senha</label>
              <input type="password" class="form-control" id="senha" required minlength="6">
            </div>
            <div class="mb-3">
              <label for="senha2" class="form-label">Confirmar senha</label>
              <input type="password" class="form-control" id="senha2" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Salvar</button>
            <p id="msg" class="mt-3 small"></p>
          </form>
        </div>
      </div>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    document.getElementById('formReset').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const s1 = document.getElementById('senha').value;
      const s2 = document.getElementById('senha2').value;
      if (s1 !== s2) { msg.textContent = 'Senhas não coincidem.'; return; }
      if (!token) { msg.textContent = 'Link inválido.'; return; }
      const res = await fetch('/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword: s1 })
      });
      if (res.ok) {
        msg.className = 'text-success';
        msg.textContent = 'Senha alterada! Redirecionando...';
        setTimeout(() => window.location.href = '/login', 2000);
      } else {
        msg.className = 'text-danger';
        msg.textContent = 'Token inválido ou expirado.';
      }
    });
  </script>
</body>
</html>
