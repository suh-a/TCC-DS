<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo da Memória - Animais</title>
  <link rel="stylesheet" href="/src/css/jogo-memoria.css" />
</head>
<body>
  <!-- ==================== TELA INICIAL ==================== -->
  <section id="tela-inicial" class="tela">
    <h1>🐾 Jogo da Memória - Animais 🐾</h1>
    <button id="btnIniciar">Iniciar Jogo</button>
  </section>

  <!-- ==================== TELA DO JOGO ==================== -->
  <section id="tela-jogo" class="tela oculto">
    <h2 id="tituloFase">Fase 1</h2>
    <p id="tempo">⏱️ Tempo: 30s</p> <!-- 🔹 Aqui -->
    <div id="tabuleiro"></div>
  </section>

  <!-- ==================== TELA DE PARABÉNS ==================== -->
  <section id="tela-vitoria" class="tela oculto">
    <h2 class="animacao-parabens">🎉 Parabéns! Você venceu essa fase! 🎉</h2>
    <div class="botoes-vitoria">
      <button id="btnContinuar">Próxima Fase</button>
      <button id="btnReiniciar">Reiniciar</button>
    </div>
  </section>

  <script src="/src/js/jogo-memoria.js"></script>
</body>
</html>
